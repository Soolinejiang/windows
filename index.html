            const cells = [];
            for (let i = 0; i < rows * cols; i++) cells.push({ mine: false, open: false, flag: false, n: 0 });

            let placed = 0;
            while (placed < total) {
                const i = Math.floor(Math.random() * cells.length);
                if (!cells[i].mine) { cells[i].mine = true; placed++; }
            }

            const neighbors = i => {
                const r = Math.floor(i / cols), c = i % cols, list = [];
                for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                    if (!dr && !dc) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) list.push(nr * cols + nc);
                }
                return list;
            };

            cells.forEach((cell, i) => {
                cell.n = neighbors(i).filter(j => cells[j].mine).length;
            });

            win._mine = { rows, cols, total, cells, neighbors, over: false, start: Date.now() };
            mineRender(win);
        }

        function mineRender(win) {
            const grid = $("[data-mine-grid]", win);
            const state = win._mine;
            if (!grid || !state) return;
            grid.innerHTML = state.cells.map((cell, i) => {
                let cls = "mine-cell" + (cell.open ? " open" : "");
                let label = "";
                if (cell.open) {
                    if (cell.mine) { cls += " boom"; label = "💥"; }
                    else if (cell.n) { cls += " mine-n" + cell.n; label = String(cell.n); }
                } else if (cell.flag) {
                    label = "🚩";
                }
                return `<div class="${cls}" data-mine-cell="${i}">${label}</div>`;
            }).join("");

            $("[data-mine-mines]", win).textContent = "💣 " +
                (state.total - state.cells.filter(c => c.flag).length);
        }

        function mineOpen(win, index) {
            const state = win._mine;
            if (!state || state.over) return;
            const cell = state.cells[index];
            if (!cell || cell.open || cell.flag) return;

            cell.open = true;
            if (cell.mine) {
                state.over = true;
                state.cells.forEach(c => { if (c.mine) c.open = true; });
                mineRender(win);
                return notify("💥 踩到雷了！点击“重新开始”再来一局");
            }

            if (cell.n === 0) {
                const stack = [index];
                while (stack.length) {
                    const cur = stack.pop();
                    state.neighbors(cur).forEach(j => {
                        const nCell = state.cells[j];
                        if (!nCell.open && !nCell.flag && !nCell.mine) {
                            nCell.open = true;
                            if (nCell.n === 0) stack.push(j);
                        }
                    });
                }
            }

            const safeCount = state.cells.length - state.total;
            const opened = state.cells.filter(c => c.open && !c.mine).length;
            mineRender(win);

            if (opened === safeCount) {
                state.over = true;
                state.cells.filter(c => c.mine).forEach(c => { c.flag = true; });
                mineRender(win);
                const seconds = Math.round((Date.now() - state.start) / 1000);
                notify("🎉 通关！用时 " + seconds + " 秒");
            }
        }

        function mineFlag(win, index) {
            const state = win._mine;
            if (!state || state.over) return;
            const cell = state.cells[index];
            if (!cell || cell.open) return;
            cell.flag = !cell.flag;
            mineRender(win);
        }

        /* ================= 任务管理器 ================= */

        function taskmgrRender(win, keepSelect) {
            const body = $("[data-task-body]", win);
            if (!body) return;
            const selected = keepSelect ? win.dataset.selectedTask : "";

            const rows = [];
            rows.push({ app: "taskmgr", cpu: (Math.random() * 2 + 0.4).toFixed(1), mem: (Math.random() * 30 + 42).toFixed(0) });
            for (const [name] of windows) {
                if (name === "taskmgr") continue;
                rows.push({
                    app: name,
                    cpu: (Math.random() * 8 + 0.5).toFixed(1),
                    mem: (Math.random() * 120 + 30).toFixed(0)
                });
            }

            body.innerHTML = rows.map(row => `
                <tr data-task-app="${row.app}" class="${row.app === selected ? "selected" : ""}">
                    <td>${apps[row.app].icon} ${apps[row.app].title}</td>
                    <td>${row.cpu}%</td>
                    <td>${row.mem} MB</td>
                    <td style="color:var(--muted)">正在运行</td>
                </tr>`).join("") ||
                `<tr><td colspan="4" class="empty">没有其他正在运行的应用。</td></tr>`;
        }

        function taskmgrEnd(win) {
            const target = win.dataset.selectedTask;
            if (!target) return notify("请先选择要结束的任务");
            if (target === "taskmgr") return notify("不能结束任务管理器自身");
            const targetWin = windows.get(target);
            if (!targetWin) return notify("该应用已关闭");
            if (targetWin._mediaStop) targetWin._mediaStop();
            windows.delete(target);
            targetWin.remove();
            delete win.dataset.selectedTask;
            updateTaskbar();
            taskmgrRender(win);
            notify("已结束任务：" + apps[target].title);
        }

        /* ================= 日历 ================= */

        function calendarRender(win) {
            const grid = $("[data-cal-grid]", win);
            const title = $("[data-cal-title]", win);
            if (!grid || !title) return;

            const now = new Date();
            const view = new Date(now.getFullYear(), now.getMonth() + (win._calMonth || 0), 1);
            title.textContent = view.getFullYear() + " 年 " + (view.getMonth() + 1) + " 月";

            const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
            const firstDay = view.getDay();
            const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
            const prevDays = new Date(view.getFullYear(), view.getMonth(), 0).getDate();
            const isThisMonth = win._calMonth === 0;

            let html = weekDays.map(d => `<div class="cal-wd">${d}</div>`).join("");
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="cal-day dim">${prevDays - i}</div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const today = isThisMonth && d === now.getDate();
                html += `<div class="cal-day${today ? " today" : ""}">${d}</div>`;
            }
            const rest = (7 - (firstDay + daysInMonth) % 7) % 7;
            for (let d = 1; d <= rest; d++) {
                html += `<div class="cal-day dim">${d}</div>`;
            }
            grid.innerHTML = html;
        }

        /* ================= 音乐播放器 ================= */

        const MEDIA_TRACKS = [
            { name: "苏联国歌-牢不可破的联盟", src: "audio/" + encodeURIComponent("苏联国歌-牢不可破的联盟.mp3") },
            { name: "X-COOL", src: "audio/X-COOL.mp3" },
            { name: "MONTAGEM SEM PARA", src: "audio/" + encodeURIComponent("MONTAGEM SEM PARA.mp3") },
            { name: "MONTAGEM 486", src: "audio/" + encodeURIComponent("MONTAGEM 486.mp3") }
        ];

        function mediaPlayTrack(win, index) {
            if (win._mediaStop) win._mediaStop();

            const track = MEDIA_TRACKS[index];
            if (!track) return;

            const audio = new Audio(track.src);
            audio.preload = "none";
            audio.volume = 0.8;

            const nowBox = $("[data-media-now]", win);
            const titleBox = $("[data-media-title]", win);
            if (nowBox) nowBox.classList.add("playing");
            if (titleBox) titleBox.textContent = "正在播放：" + track.name;

            function stop() {
                if (win._mediaAudio === audio) {
                    win._mediaAudio = null;
                }
                try { audio.pause(); } catch {}
                try { audio.currentTime = 0; } catch {}
                if (nowBox) nowBox.classList.remove("playing");
                if (titleBox) titleBox.textContent = "未在播放";
                win._mediaStop = null;
            }

            win._mediaAudio = audio;
            win._mediaStop = stop;

            audio.addEventListener("ended", stop, { once: true });
            audio.addEventListener("error", () => {
                stop();
                notify("音频加载失败，请检查 MP3 文件路径和文件名");
            }, { once: true });

            audio.play().catch(() => {
                stop();
                notify("音频无法播放，请确认文件存在并重试");
            });
        }

        /* ================= 上下文菜单 ================= */

        function showContextMenu(x, y, state) {
            contextState = state;
            const menu = $("#contextMenu");
            const node = state.nodeId ? findNode(state.nodeId) : null;

            let html = "";
            if (node) {
                html += `<button data-action="open">📂 打开</button>
                <button data-action="rename">✏️ 重命名</button>
                <button data-action="copy">📄 复制</button>
                <button data-action="cut">✂️ 剪切</button>
                <button data-action="delete">🗑️ 删除</button><div class="separator"></div>`;
            }
            html += `<button data-action="new-folder">📁 新建文件夹</button>
            <button data-action="new-file">📄 新建文本文档</button>
            <button data-action="paste">📋 粘贴</button>
            <div class="separator"></div>
            <button data-action="refresh">🔄 刷新</button>
            <button data-action="settings">⚙️ 设置</button>`;

            menu.innerHTML = html;
            menu.style.left = Math.min(x, innerWidth - 220) + "px";
            menu.style.top = Math.min(y, innerHeight - 250) + "px";
            menu.classList.add("show");
        }

        $("#contextMenu").addEventListener("click", event => {
            const button = event.target.closest("[data-action]");
            if (!button || !contextState) return;
            const action = button.dataset.action;
            const state = contextState;
            $("#contextMenu").classList.remove("show");

            const destination = state.place === "desktop" ? desktopFolder().id : state.folderId;
            if (action === "open" && state.nodeId) return openNode(state.nodeId);
            if (action === "rename" && state.nodeId) return renameItem(state.nodeId);
            if (action === "delete" && state.nodeId) return deleteItem(state.nodeId);
            if (action === "copy" && state.nodeId) return copyOrCut(state.nodeId, "copy");
            if (action === "cut" && state.nodeId) return copyOrCut(state.nodeId, "cut");
            if (action === "new-folder") return createItem(destination, "folder");
            if (action === "new-file") return createItem(destination, "file");
            if (action === "paste") return pasteInto(destination);
            if (action === "refresh") return refreshAll();
            if (action === "settings") return openApp("settings");
        });

        $("#desktop").addEventListener("contextmenu", event => {
            event.preventDefault();
            const item = event.target.closest("[data-node]");
            showContextMenu(event.clientX, event.clientY, {
                place: "desktop",
                nodeId: item?.dataset.node || null,
                folderId: desktopFolder().id
            });
        });

        $("#desktop").addEventListener("click", event => {
            const icon = event.target.closest(".desktop-icon");
            $$(".desktop-icon").forEach(item => item.classList.toggle("selected", item === icon));
            if (event.detail === 2 && icon) {
                if (icon.dataset.app) openApp(icon.dataset.app);
                else if (icon.dataset.node) openNode(icon.dataset.node);
            }
        });

        $("#startButton").addEventListener("click", () => {
            closePanels();
            $("#startMenu").classList.toggle("show");
        });

        $("#quickButton").addEventListener("click", () => {
            closePanels();
            $("#quickPanel").classList.toggle("show");
        });

        $("#clockButton").addEventListener("click", () => {
            closePanels();
            $("#notifications").classList.toggle("show");
        });

        $("#appGrid").addEventListener("click", event => {
            const button = event.target.closest("[data-app]");
            if (button) openApp(button.dataset.app);
        });

        $$("[data-launch]").forEach(button => button.addEventListener("click", () => {
            const appName = button.dataset.launch;
            const win = windows.get(appName);
            if (win && !win.classList.contains("minimized")) {
                win.classList.add("minimized");
                updateTaskbar();
            } else {
                openApp(appName);
            }
        }));

        $("#startSearch").addEventListener("input", event => {
            const query = event.target.value.toLowerCase().trim();
            $$(".app-item").forEach(item => {
                item.style.display = item.dataset.name.toLowerCase().includes(query) ? "" : "none";
            });
        });

        $("#taskSearch").addEventListener("click", () => {
            closePanels();
            $("#startMenu").classList.add("show");
            $("#startSearch").focus();
        });

        $("#allApps").addEventListener("click", () => {
            $("#startSearch").value = "";
            $$(".app-item").forEach(item => item.style.display = "");
            $("#startSearch").focus();
        });

        $("#quickPanel").addEventListener("click", event => {
            const tile = event.target.closest(".quick-tile");
            if (tile) tile.classList.toggle("on");
        });

        $("#clearNotifications").addEventListener("click", () => {
            $("#notificationCard").textContent = "没有新的通知。";
        });

        $("#powerButton").addEventListener("click", () => notify("模拟器不能关闭或重启电脑"));

        document.addEventListener("pointerdown", event => {
            if (!event.target.closest(".panel") &&
                !event.target.closest("#startButton") &&
                !event.target.closest(".tray") &&
                !event.target.closest("#taskSearch")) {
                $$(".panel").forEach(panel => panel.classList.remove("show"));
            }
            if (!event.target.closest(".context-menu")) $("#contextMenu").classList.remove("show");
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closePanels();
            if (event.key === "Delete") {
                const focused = $(".window.focused");
                const selected = focused?.dataset.selectedFile;
                if (selected) deleteItem(selected);
            }
            if (event.key === "Enter" && event.target === $("#startSearch")) {
                const first = $$(".app-item").find(item => item.style.display !== "none");
                if (first) openApp(first.dataset.app);
            }
        });

        function setWallpaper(name) {
            document.body.classList.remove("wall-purple", "wall-green");
            if (name === "purple") document.body.classList.add("wall-purple");
            if (name === "green") document.body.classList.add("wall-green");
            localStorage.setItem("web-windows-wallpaper", name);
            notify("桌面壁纸已更换");
        }

        function updateClock() {
            const now = new Date();
            $("#clockTime").textContent = now.toLocaleTimeString("zh‑CN", {
                hour: "2‑digit", minute: "2‑digit"
            });
            $("#clockDate").textContent = now.toLocaleDateString("zh‑CN", {
                year: "numeric", month: "2‑digit", day: "2‑digit"
            });
        }

        if (localStorage.getItem("web-windows-dark") === "true") {
            document.body.classList.add("dark");
        }
        const savedWallpaper = localStorage.getItem("web-windows-wallpaper");
        if (savedWallpaper) setWallpaper(savedWallpaper);

        renderDesktop();
        updateClock();
        setInterval(updateClock, 1000);

    })();
    </script>
