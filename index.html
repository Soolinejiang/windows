<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Web 桌面</title>
    <style>
    :root {
        --text: #20232b;
        --muted: #6b7280;
        --panel: rgba(248, 249, 253, .95);
        --taskbar: rgba(241, 243, 249, .82);
        --window-bg: #f7f8fb;
        --content-bg: #fff;
        --accent: #527df3;
        --line: rgba(110, 120, 140, .18);
        --shadow: 0 18px 60px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background:
            radial-gradient(ellipse at 68% 48%, #4da6ff 0%, transparent 30%),
            radial-gradient(ellipse at 54% 50%, #6470ff 0%, transparent 33%),
            radial-gradient(ellipse at 30% 64%, #414dd1 0%, transparent 34%),
            linear-gradient(135deg, #123f86, #171b58 55%, #071326);
    }

    body.dark {
        --text: #f1f3f8;
        --muted: #b6bece;
        --panel: rgba(32, 36, 48, .96);
        --taskbar: rgba(25, 29, 39, .86);
        --window-bg: #242833;
        --content-bg: #1d2028;
        --line: rgba(255,255,255,.13);
        --shadow: 0 18px 60px rgba(0, 0, 0, .5);
    }

    body.wall-purple {
        background:
            radial-gradient(ellipse at 68% 48%, #f7a4ff 0%, transparent 30%),
            radial-gradient(ellipse at 54% 50%, #8878f5 0%, transparent 34%),
            radial-gradient(ellipse at 30% 64%, #552ca6 0%, transparent 35%),
            linear-gradient(135deg, #542a8e, #211c5c 55%, #110c2d);
    }

    body.wall-green {
        background:
            radial-gradient(ellipse at 68% 48%, #98f3b2 0%, transparent 30%),
            radial-gradient(ellipse at 54% 50%, #51c7a6 0%, transparent 34%),
            radial-gradient(ellipse at 30% 64%, #247e88 0%, transparent 35%),
            linear-gradient(135deg, #145d63, #143749 55%, #071d2b);
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .desktop {
        position: absolute;
        inset: 0 0 48px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-content: flex-start;
        flex-wrap: wrap;
        gap: 5px;
        overflow: auto;
    }

    .desktop-icon {
        width: 86px;
        min-height: 82px;
        padding: 7px 4px;
        border: 1px solid transparent;
        border-radius: 5px;
        color: #fff;
        text-align: center;
        text-shadow: 0 1px 3px #000;
        font-size: 12px;
        cursor: default;
    }

    .desktop-icon:hover, .desktop-icon.selected {
        background: rgba(255,255,255,.18);
        border-color: rgba(255,255,255,.2);
    }

    .desktop-icon .icon {
        display: block;
        margin-bottom: 5px;
        font-size: 32px;
        line-height: 38px;
    }

    .taskbar {
        position: fixed;
        z-index: 5000;
        inset: auto 0 0;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--taskbar);
        border-top: 1px solid rgba(255,255,255,.4);
        backdrop-filter: blur(24px);
        color: var(--text);
    }

    .taskbar-center { height: 100%; display: flex; align-items: center; gap: 3px; }

    .task-button {
        position: relative;
        width: 42px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        font-size: 20px;
    }

    .task-button:hover, .task-button.active { background: rgba(128,140,165,.18); }
    .task-button.open::after {
        content: "";
        position: absolute;
        bottom: 1px;
        left: 16px;
        width: 10px;
        height: 3px;
        border-radius: 4px;
        background: var(--accent);
    }

    .win-logo {
        width: 21px;
        height: 21px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
        transform: skewY(-5deg);
    }
    .win-logo i { background: #1684f8; }

    .task-search {
        width: 175px;
        height: 33px;
        padding: 0 11px;
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 18px;
        color: var(--text);
        background: rgba(255,255,255,.58);
        cursor: text;
        font-size: 12px;
    }
    body.dark .task-search { background: rgba(255,255,255,.1); }
    .task-search input {
        width: 100%;
        border: 0;
        outline: 0;
        color: inherit;
        background: transparent;
    }

    .tray {
        position: absolute;
        right: 8px;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 3px;
    }

    .tray button {
        min-width: 35px;
        height: 38px;
        padding: 0 6px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: transparent;
        cursor: pointer;
    }
    .tray button:hover { background: rgba(128,140,165,.18); }
    .clock { min-width: 76px; text-align: center; font-size: 11px; line-height: 1.35; }

    .panel, .context-menu {
        display: none;
        position: fixed;
        z-index: 4500;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(25px);
    }
    .panel.show, .context-menu.show { display: block; }

    .start-menu {
        left: 50%;
        bottom: 57px;
        transform: translateX(-50%);
        width: min(570px, calc(100vw - 16px));
        max-height: calc(100vh - 65px);
        overflow: auto;
        padding: 20px 24px 16px;
    }

    .start-search {
        width: 100%;
        height: 39px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-bottom: 2px solid var(--accent);
        border-radius: 5px;
        outline: 0;
        color: var(--text);
        background: rgba(255,255,255,.5);
    }
    body.dark .start-search { background: rgba(255,255,255,.1); }

    .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 20px 2px 10px;
        font-size: 14px;
        font-weight: 600;
    }

    .heading button, .small-button {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: rgba(128,140,165,.1);
        cursor: pointer;
        font-size: 11px;
    }

    .app-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
    .app-item {
        min-height: 78px;
        padding: 8px 3px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: transparent;
        cursor: pointer;
        font-size: 11px;
    }
    .app-item:hover { background: rgba(128,140,165,.16); }
    .app-item .icon { font-size: 27px; }

    .start-footer {
        margin: 18px -24px -16px;
        padding: 11px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(128,140,165,.1);
        font-size: 12px;
    }
    .user { display: flex; align-items: center; gap: 9px; }
    .avatar {
        width: 29px; height: 29px; display: grid; place-items: center;
        border-radius: 50%; color: white; background: linear-gradient(135deg,#80b8ff,#526ee7);
    }

    .quick-panel, .notifications {
        right: 10px;
        bottom: 57px;
        width: min(335px, calc(100vw - 16px));
        padding: 15px;
    }

    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-tile {
        min-height: 48px;
        padding: 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: rgba(128,140,165,.15);
        cursor: pointer;
        text-align: left;
        font-size: 12px;
    }
    .quick-tile.on { color: white; background: #5578df; }
    .slider-row { margin-top: 14px; display: flex; align-items: center; gap: 9px; }
    .slider-row input { width: 100%; accent-color: var(--accent); }
    .notification {
        margin-top: 10px;
        padding: 12px;
        border-radius: 6px;
        background: rgba(128,140,165,.13);
        font-size: 12px;
        line-height: 1.55;
    }

    .window {
        position: absolute;
        z-index: 100;
        top: 80px;
        left: 50%;
        width: min(820px, calc(100vw - 24px));
        height: min(550px, calc(100vh - 100px));
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 8px;
        color: var(--text);
        background: var(--window-bg);
        box-shadow: var(--shadow);
    }
    .window.show { display: flex; }
    .window.minimized { display: none; }
    .window.maximized {
        inset: 5px 5px 53px !important;
        width: auto !important;
        height: auto !important;
        transform: none !important;
    }

    .titlebar {
        height: 38px;
        min-height: 38px;
        padding-left: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--window-bg);
        cursor: move;
        touch-action: none;
    }
    .window-title { display: flex; gap: 8px; align-items: center; font-size: 12px; }
    .window-controls { height: 100%; display: flex; }
    .window-controls button {
        width: 43px;
        border: 0;
        color: inherit;
        background: transparent;
        cursor: pointer;
    }
    .window-controls button:hover { background: rgba(128,140,165,.18); }
    .window-controls .close:hover { color: white; background: #c42b1c; }
    .window-content { flex: 1; min-height: 0; overflow: auto; background: var(--content-bg); }

    .toolbar {
        min-height: 43px;
        padding: 5px 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid var(--line);
    }
    .tool {
        min-width: 32px;
        height: 30px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        color: inherit;
        background: transparent;
        cursor: pointer;
    }
    .tool:hover { background: rgba(128,140,165,.17); }
    .address {
        flex: 1;
        min-width: 70px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(128,140,165,.07);
        font-size: 12px;
    }

    .explorer-layout { height: calc(100% - 43px); display: flex; }
    .sidebar {
        width: 165px;
        flex: 0 0 165px;
        padding: 10px 7px;
        border-right: 1px solid var(--line);
    }
    .nav-item {
        padding: 9px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }
    .nav-item:hover, .nav-item.selected { background: rgba(128,140,165,.15); }
    .files-area { flex: 1; padding: 18px; overflow: auto; }
    .files-heading { margin: 0 0 15px; font-size: 18px; font-weight: 500; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(105px,1fr)); gap: 8px; }
    .file-item {
        min-height: 85px;
        padding: 10px 5px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 5px;
        text-align: center;
        cursor: default;
        font-size: 12px;
        overflow-wrap: anywhere;
    }
    .file-item:hover, .file-item.selected {
        border-color: rgba(82,125,243,.35);
        background: rgba(82,125,243,.09);
    }
    .file-item .icon { display: block; margin-bottom: 6px; font-size: 30px; }
    .empty { color: var(--muted); font-size: 13px; }

    .notepad-wrap { height: 100%; display: flex; flex-direction: column; }
    .notepad-menu {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
    }
    .notepad-text {
        flex: 1;
        width: 100%;
        padding: 14px;
        resize: none;
        border: 0;
        outline: 0;
        color: var(--text);
        background: var(--content-bg);
        font: 14px/1.6 Consolas, monospace;
        user-select: text;
    }

    .settings { max-width: 680px; padding: 26px; }
    .settings h2 { font-weight: 500; }
    .setting-card {
        margin: 12px 0;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(128,140,165,.06);
        font-size: 13px;
    }
    .setting-card p { color: var(--muted); font-size: 12px; }
    .setting-card button {
        margin: 3px;
        padding: 8px 11px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: rgba(82,125,243,.16);
        cursor: pointer;
    }

    .calc { width: min(340px,100%); margin: 18px auto; padding: 10px; }
    .calc-display {
        width: 100%; height: 75px; padding: 10px;
        border: 0; outline: 0; color: inherit; background: transparent;
        text-align: right; font-size: 34px;
    }
    .calc-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; }
    .calc-key {
        height: 50px; border: 1px solid var(--line); border-radius: 5px;
        color: inherit; background: rgba(128,140,165,.1); cursor: pointer;
    }
    .calc-key:hover { background: rgba(128,140,165,.23); }
    .calc-key.equals { color: white; background: var(--accent); }

    .context-menu {
        width: 210px;
        padding: 5px;
        z-index: 7000;
    }
    .context-menu button {
        width: 100%;
        padding: 8px 9px;
        display: block;
        border: 0;
        border-radius: 4px;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
        font-size: 12px;
    }
    .context-menu button:hover { background: rgba(128,140,165,.17); }
    .context-menu .separator { height: 1px; margin: 4px; background: var(--line); }

    .toast {
        position: fixed;
        z-index: 8000;
        right: 16px;
        bottom: 58px;
        max-width: min(350px, calc(100vw - 32px));
        padding: 12px 15px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        background: var(--panel);
        box-shadow: var(--shadow);
        font-size: 12px;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
        .task-search { width: 38px; justify-content: center; padding: 0; }
        .task-search input { display: none; }
        .taskbar-center { transform: translateX(-18px); }
        .app-grid { grid-template-columns: repeat(4,1fr); }
        .sidebar { width: 120px; flex-basis: 120px; }
    }
    @media (max-width: 390px) {
        .app-grid { grid-template-columns: repeat(3,1fr); }
        .task-button { width: 36px; }
        .taskbar-center { gap: 0; }
        .sidebar { width: 98px; flex-basis: 98px; }
    }
    </style>
</head>
<body>
    <main class="desktop" id="desktop"></main>

    <section class="panel start-menu" id="startMenu">
        <input class="start-search" id="startSearch" placeholder="搜索应用和文件" autocomplete="off">
        <div class="heading"><span>已固定</span><button id="allApps">所有应用 </button></div>
        <div class="app-grid" id="appGrid">
            <button class="app-item" data-app="explorer" data-name="文件资源管理器">
                <span class="icon">📂</span><span>文件资源管理器</span>
            </button>
            <button class="app-item" data-app="notepad" data-name="记事本 文本">
                <span class="icon">📄</span><span>记事本</span>
            </button>
            <button class="app-item" data-app="calculator" data-name="计算器">
                <span class="icon">🧮</span><span>计算器</span>
            </button>
            <button class="app-item" data-app="settings" data-name="设置 个性化">
                <span class="icon">⚙️</span><span>设置</span>
            </button>
            <button class="app-item" data-app="trash" data-name="回收站">
                <span class="icon">🗑️</span><span>回收站</span>
            </button>
            <button class="app-item" data-app="about" data-name="关于">
                <span class="icon">ℹ️</span><span>关于</span>
            </button>
        </div>
        <div class="start-footer">
            <div class="user"><span class="avatar">👤</span><span>用户</span></div>
            <button class="small-button" id="powerButton">🔒 关机</button>
        </div>
    </section>

    <section class="panel quick-panel" id="quickPanel">
        <div class="quick-grid">
            <button class="quick-tile on">📶 Wi‑Fi</button>
            <button class="quick-tile on">🔔 蓝牙</button>
            <button class="quick-tile">🌙 勿扰模式</button>
            <button class="quick-tile on">🔆 夜灯模式</button>
        </div>
        <div class="slider-row">💡 <input type="range" min="20" max="100" value="80"></div>
        <div class="slider-row">🔊 <input type="range" min="0" max="100" value="65"></div>
        <p style="font-size:12px;color:var(--muted)">🔊 音量 · 点击关机按钮关机</p>
    </section>

    <section class="panel notifications" id="notifications">
        <div class="heading" style="margin-top:0"><span>通知</span><button id="clearNotifications">清除全部</button></div>
        <div class="notification" id="notificationCard"><b>ℹ️ 欢迎使用 Windows</b><br>文件保存在浏览器本地存储中。</div>
        <div class="notification">记事本可以新建、保存、编辑各类文档文件。</div>
    </section>

    <div class="context-menu" id="contextMenu"></div>
    <div class="toast" id="toast"></div>

    <footer class="taskbar">
        <div class="taskbar-center">
            <button class="task-button" id="startButton" title="打开开始菜单">
                <span class="win-logo"><i></i><i></i><i></i><i></i></span>
            </button>
            <label class="task-search" id="taskSearch">🔍 <input id="taskSearchInput" placeholder="搜索"></label>
            <button class="task-button" data-launch="explorer" title="文件资源管理器">📂</button>
            <button class="task-button" data-launch="notepad" title="记事本">📄</button>
            <button class="task-button" data-launch="calculator" title="计算器">🧮</button>
        </div>
        <div class="tray">
            <button id="quickButton" title="快速设置">⚙ 📶 🔊 🔔</button>
            <button class="clock" id="clockButton" title="通知和日历">
                <div id="clockTime"></div><div id="clockDate"></div>
            </button>
        </div>
    </footer>

<script>
(() => {
    "use strict";

    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => [...root.querySelectorAll(s)];
    const STORAGE_KEY = "web-windows-fs-v2";
    const TRASH_KEY = "web-windows-trash-v2";

    const apps = {
        explorer: { title: "文件资源管理器", icon: "📂" },
        notepad: { title: "记事本", icon: "📄" },
        calculator: { title: "计算器", icon: "🧮" },
        settings: { title: "设置", icon: "⚙️" },
        trash: { title: "回收站", icon: "🗑️" },
        about: { title: "关于 Windows Web", icon: "ℹ️" }
    };

    function id() {
        return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function folder(name, children = []) {
        return { id: id(), name, type: "folder", children };
    }

    function file(name, content = "") {
        return { id: id(), name, type: "file", content };
    }

    function makeInitialFS() {
        return folder("此电脑", [
            folder("桌面", [
                folder("新建文件夹"),
                file("欢迎使用.txt", "欢迎使用 Windows Web 桌面！\n\n你可以在桌面新建文件和文件夹。")
            ]),
            folder("文档"),
            folder("下载"),
            folder("图片"),
            folder("音乐"),
            folder("视频"),
            folder("本地磁盘 (C:)"),
            folder("本地磁盘 (D:)")
        ]);
    }

    function readJSON(key, fallback) {
        try {
            const value = JSON.parse(localStorage.getItem(key));
            return value || fallback;
        } catch {
            return fallback;
        }
    }

    let fs = readJSON(STORAGE_KEY, null);
    if (!fs || fs.type !== "folder" || !Array.isArray(fs.children)) fs = makeInitialFS();
    let trash = readJSON(TRASH_KEY, []);
    if (!Array.isArray(trash)) trash = [];

    const windows = new Map();
    let zIndex = 100;
    let clipboard = null;
    let toastTimer;
    let contextState = null;

    function saveFS() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fs));
        localStorage.setItem(TRASH_KEY, JSON.stringify(trash));
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, ch => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
    }

    function findNode(nodeId, node = fs) {
        if (node.id === nodeId) return node;
        if (node.type === "folder") {
            for (const child of node.children) {
                const found = findNode(nodeId, child);
                if (found) return found;
            }
        }
        return null;
    }

    function findParent(nodeId, node = fs) {
        if (node.type !== "folder") return null;
        for (const child of node.children) {
            if (child.id === nodeId) return node;
            const found = findParent(nodeId, child);
            if (found) return found;
        }
        return null;
    }

    function desktopFolder() {
        return fs.children.find(item => item.name === "桌面" && item.type === "folder") || fs;
    }

    function iconFor(node) {
        if (node.type === "folder") return "📁";
        if (/\.txt$/i.test(node.name)) return "📄";
        return "📃";
    }

    function notify(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function closePanels() {
        $$(".panel").forEach(panel => panel.classList.remove("show"));
        $("#contextMenu").classList.remove("show");
    }

    function renderDesktop() {
        const desktop = $("#desktop");
        const items = desktopFolder().children;
        desktop.innerHTML = `
            <div class="desktop-icon" data-app="explorer"><span class="icon">📂</span>此电脑</div>
            <div class="desktop-icon" data-app="notepad"><span class="icon">📄</span>记事本</div>
            <div class="desktop-icon" data-app="calculator"><span class="icon">🧮</span>计算器</div>
            <div class="desktop-icon" data-app="trash"><span class="icon">${trash.length ? "🗑️" : "🗳️"}</span>回收站</div>
            ${items.map(item => `
                <div class="desktop-icon" data-node="${escapeHTML(item.id)}">
                    <span class="icon">${iconFor(item)}</span>${escapeHTML(item.name)}
                </div>`).join("")}`;
    }

    function getExplorerContent() {
        return `
            <div class="toolbar">
                <button class="tool" data-command="back" title="返回">←</button>
                <button class="tool" data-command="forward" title="前进">→</button>
                <button class="tool" data-command="up" title="上一级">↑</button>
                <div class="address" data-address>📂 此电脑</div>
                <input class="address" data-filter placeholder="搜索此电脑中的文件" style="max-width:190px">
                <button class="tool" data-command="new-folder" title="新建文件夹">📁➕</button>
                <button class="tool" data-command="new-file" title="新建文本文档">📄➕</button>
                <button class="tool" data-command="refresh" title="刷新">⟳</button>
            </div>
            <div class="explorer-layout">
                <aside class="sidebar">
                    <div class="nav-item selected" data-location="root">📂 此电脑</div>
                    <div class="nav-item" data-location="desktop">🖥️ 桌面</div>
                    <div class="nav-item" data-location="documents">📄 文档</div>
                    <div class="nav-item" data-location="downloads">📥 下载</div>
                    <div class="nav-item" data-location="pictures">🖼️ 图片</div>
                    <div class="nav-item" data-location="trash">🗑️ 回收站</div>
                    <div class="nav-item" data-location="root">📂 此电脑</div>
                </aside>
                <div class="files-area" data-files-area></div>
            </div>`;
    }

    function openApp(appName, options = {}) {
        if (!apps[appName]) return;
        closePanels();

        let win = windows.get(appName);
        if (!win) {
            win = document.createElement("section");
            win.className = "window show";
            win.dataset.app = appName;
            win.style.left = `calc(50% - ${Math.min(windows.size * 16, 75)}px)`;
            win.style.top = `${75 + Math.min(windows.size * 18, 60)}px`;
            win.style.zIndex = ++zIndex;
            win.innerHTML = `
                <header class="titlebar">
                    <div class="window-title"><span>${apps[appName].icon}</span><span>${apps[appName].title}</span></div>
                    <div class="window-controls">
                        <button data-window="minimize" title="最小化">-</button>
                        <button data-window="maximize" title="最大化">□</button>
                        <button class="close" data-window="close" title="关闭">×</button>
                    </div>
                </header>
                <div class="window-content">${contentFor(appName)}</div>`;
            document.body.appendChild(win);
            windows.set(appName, win);
            attachWindowEvents(win);
        } else {
            win.classList.remove("minimized");
            win.classList.add("show");
        }

        if (appName === "explorer" && options.folderId) {
            showFolder(win, options.folderId);
        }
        if (appName === "notepad" && options.fileId) {
            loadTextFile(win, options.fileId);
        }

        focusWindow(win);
        updateTaskbar();
    }

    function contentFor(appName) {
        if (appName === "explorer") return getExplorerContent();

        if (appName === "notepad") {
            return `<div class="notepad-wrap">
                <div class="notepad-menu">
                    <button class="tool" data-note="new">新建</button>
                    <button class="tool" data-note="save">保存</button>
                    <span data-note-name>未命名.txt</span>
                </div>
                <textarea class="notepad-text" spellcheck="false" placeholder="在此处输入文字…"></textarea>
            </div>`;
        }

        if (appName === "calculator") {
            return `<div class="calc">
                <input class="calc-display" value="0" readonly>
                <div class="calc-grid">
                    ${["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="]
                    .map(key => `<button class="calc-key" data-calc="${key}">${key}</button>`).join("")}
                </div>
            </div>`;
        }

        if (appName === "settings") {
            return `<div class="settings">
                <h2>个性化</h2>
                <div class="setting-card"><b>明暗模式</b><p>切换桌面的亮色和暗色主题外观。</p>
                    <button data-setting="theme">切换暗色 / 亮色模式</button></div>
                <div class="setting-card"><b>桌面壁纸</b><p>选择一个新壁纸主题外观。</p>
                    <button data-wallpaper="blue">蓝色</button>
                    <button data-wallpaper="purple">紫色</button>
                    <button data-wallpaper="green">绿色</button></div>
                <div class="setting-card"><b>存储说明</b><p>文件保存在浏览器本地的存储空间中。清除浏览器缓存会丢失全部文件。</p></div>
            </div>`;
        }

        if (appName === "trash") {
            return `<div class="toolbar">
                <button class="tool" data-trash="restore">还原</button>
                <button class="tool" data-trash="empty">清空回收站</button>
            </div>
            <div class="files-area" data-trash-area></div>`;
        }

        return `<div style="max-width:550px;margin:55px auto;padding:20px;text-align:center">
            <div style="font-size:56px">ℹ️</div><h2>Windows Web 桌面</h2>
            <p style="color:var(--muted);line-height:1.7">
                使用 HTML、CSS 和 JavaScript 编写的桌面模拟器。你可以模拟 Windows 系统，并且可以创建各类文档文件。
            </p><p style="color:var(--muted);font-size:12px">版本 2.0</p></div>`;
    }

    function focusWindow(win) {
        win.style.zIndex = ++zIndex;
        $$(".window").forEach(item => item.classList.remove("focused"));
        win.classList.add("focused");
    }

    function attachWindowEvents(win) {
        const titlebar = $(".titlebar", win);
        let dragging = false;
        let dx = 0;
        let dy = 0;

        win.addEventListener("pointerdown", () => focusWindow(win));
        titlebar.addEventListener("pointerdown", event => {
            if (event.target.closest(".window-controls") || win.classList.contains("maximized")) return;
            dragging = true;
            const rect = win.getBoundingClientRect();
            dx = event.clientX - rect.left;
            dy = event.clientY - rect.top;
            win.style.left = rect.left + "px";
            win.style.top = rect.top + "px";
            win.style.transform = "none";
            titlebar.setPointerCapture(event.pointerId);
        });
        titlebar.addEventListener("pointermove", event => {
            if (!dragging) return;
            win.style.left = Math.max(0, event.clientX - dx) + "px";
            win.style.top = Math.max(0, event.clientY - dy) + "px";
        });
        titlebar.addEventListener("pointerup", () => dragging = false);
        titlebar.addEventListener("pointercancel", () => dragging = false);

        win.addEventListener("click", event => {
            const action = event.target.closest("[data-window]");
            if (action) {
                const type = action.dataset.window;
                if (type === "close") {
                    windows.delete(win.dataset.app);
                    win.remove();
                    updateTaskbar();
                } else if (type === "minimize") {
                    win.classList.add("minimized");
                    updateTaskbar();
                } else if (type === "maximize") {
                    toggleMaximize(win);
                }
                return;
            }

            const cmd = event.target.closest("[data-command]");
            if (cmd) return runExplorerCommand(win, cmd.dataset.command);

            const nav = event.target.closest("[data-location]");
            if (nav) return goLocation(win, nav.dataset.location);

            const fileItem = event.target.closest("[data-file-id]");
            if (fileItem) {
                $$(".file-item", win).forEach(item => item.classList.remove("selected"));
                fileItem.classList.add("selected");
                win.dataset.selectedFile = fileItem.dataset.fileId;
                if (event.detail === 2) openNode(fileItem.dataset.fileId);
                return;
            }

            const noteAction = event.target.closest("[data-note]");
            if (noteAction) return noteCommand(win, noteAction.dataset.note);

            const calcKey = event.target.closest("[data-calc]");
            if (calcKey) return calculatorKey(win, calcKey.dataset.calc);

            const setting = event.target.closest("[data-setting]");
            if (setting) {
                document.body.classList.toggle("dark");
                localStorage.setItem("web-windows-dark", document.body.classList.contains("dark"));
                return;
            }

            const wallpaper = event.target.closest("[data-wallpaper]");
            if (wallpaper) return setWallpaper(wallpaper.dataset.wallpaper);

            const trashAction = event.target.closest("[data-trash]");
            if (trashAction) {
                if (trashAction.dataset.trash === "empty") emptyTrash();
                if (trashAction.dataset.trash === "restore") restoreSelected(win);
                return;
            }
        });

        win.addEventListener("input", event => {
            if (event.target.matches("[data-filter]")) renderExplorer(win);
            if (event.target.matches(".notepad-text")) {
                const fileId = win.dataset.fileId;
                const node = fileId && findNode(fileId);
                if (node) {
                    node.content = event.target.value;
                    saveFS();
                }
            }
        });

        win.addEventListener("contextmenu", event => {
            const item = event.target.closest("[data-file-id]");
            if (item) {
                event.preventDefault();
                showContextMenu(event.clientX, event.clientY, {
                    place: "explorer",
                    nodeId: item.dataset.fileId,
                    folderId: win.dataset.folderId || fs.id,
                    app: win.dataset.app
                });
            }
        });

        if (win.dataset.app === "explorer") {
            win.dataset.folderId = fs.id;
            renderExplorer(win);
        }
        if (win.dataset.app === "trash") renderTrash(win);
    }

    function toggleMaximize(win) {
        if (win.classList.toggle("maximized")) {
            win.style.transform = "none";
        } else {
            win.style.left = "50%";
            win.style.top = "80px";
            win.style.transform = "translateX(-50%)";
            win.style.width = "";
            win.style.height = "";
        }
    }

    function updateTaskbar() {
        $$("[data-launch]").forEach(button => {
            const win = windows.get(button.dataset.launch);
            button.classList.toggle("open", Boolean(win));
            button.classList.toggle("active", Boolean(win && !win.classList.contains("minimized")));
        });
    }

    function showFolder(win, folderId) {
        const node = findNode(folderId);
        if (!node || node.type !== "folder") return;
        win.dataset.folderId = folderId;
        renderExplorer(win);
    }

    function renderExplorer(win) {
        const folderId = win.dataset.folderId || fs.id;
        const current = findNode(folderId);
        if (!current || current.type !== "folder") {
            win.dataset.folderId = fs.id;
            return renderExplorer(win);
        }

        const address = $("[data-address]", win);
        const area = $("[data-files-area]", win);
        if (!area) return;
        address.textContent = "📂 " + current.name;

        const query = ($("[data-filter]", win)?.value || "").trim().toLowerCase();
        const items = current.children.filter(node => node.name.toLowerCase().includes(query));

        area.innerHTML = `
            <h2 class="files-heading">${escapeHTML(current.name)}</h2>
            ${items.length ? `<div class="file-grid">${items.map(node => `
                <div class="file-item" data-file-id="${escapeHTML(node.id)}" title="${escapeHTML(node.name)}">
                    <span class="icon">${iconFor(node)}</span>${escapeHTML(node.name)}
                </div>`).join("")}</div>` : `<p class="empty">此文件夹为空。可以点击上方按钮新建文件。</p>`}`;
    }

    function renderTrash(win) {
        const area = $("[data-trash-area]", win);
        if (!area) return;
        area.innerHTML = trash.length
            ? `<div class="file-grid">${trash.map(entry => `
                <div class="file-item" data-trash-id="${escapeHTML(entry.node.id)}">
                    <span class="icon">${iconFor(entry.node)}</span>${escapeHTML(entry.node.name)}
                </div>`).join("")}</div>`
            : `<p class="empty">回收站为空。</p>`;

        $$("[data-trash-id]", win).forEach(item => {
            item.addEventListener("click", () => {
                $$("[data-trash-id]", win).forEach(other => other.classList.remove("selected"));
                item.classList.add("selected");
                win.dataset.selectedTrash = item.dataset.trashId;
            });
            item.addEventListener("dblclick", () => restoreItem(item.dataset.trashId));
        });
    }

    function createItem(parentId, type) {
        const parent = findNode(parentId);
        if (!parent || parent.type !== "folder") return;

        const defaultName = type === "folder" ? "新建文件夹" : "新建文本文档.txt";
        const name = prompt(type === "folder" ? "输入文件夹名称：" : "输入文件名称：", defaultName);
        if (name === null) return;

        const cleanName = name.trim();
        if (!cleanName) return notify("名称不能为空");
        if (parent.children.some(item => item.name.toLowerCase() === cleanName.toLowerCase())) {
            return notify("该位置已经存在同名文件或文件夹");
        }

        const node = type === "folder" ? folder(cleanName) : file(cleanName);
        parent.children.push(node);
        saveFS();
        refreshAll();
        notify(type === "folder" ? "文件夹已创建" : "文件已创建");
    }

    function renameItem(nodeId) {
        const node = findNode(nodeId);
        const parent = findParent(nodeId);
        if (!node || !parent) return;
        const name = prompt("输入新名称：", node.name);
        if (name === null) return;
        const cleanName = name.trim();
        if (!cleanName) return notify("名称不能为空");
        if (parent.children.some(item => item.id !== nodeId && item.name.toLowerCase() === cleanName.toLowerCase())) {
            return notify("该位置已经存在同名文件或文件夹");
        }
        node.name = cleanName;
        saveFS();
        refreshAll();
        notify("已重命名");
    }

    function deleteItem(nodeId) {
        const parent = findParent(nodeId);
        if (!parent) return;
        const index = parent.children.findIndex(item => item.id === nodeId);
        if (index < 0) return;
        const [node] = parent.children.splice(index, 1);
        trash.push({ node, parentId: parent.id, deletedAt: Date.now() });
        saveFS();
        refreshAll();
        notify("项目已移到回收站");
    }

    function restoreItem(nodeId) {
        const index = trash.findIndex(entry => entry.node.id === nodeId);
        if (index < 0) return;
        const entry = trash[index];
        let parent = findNode(entry.parentId);
        if (!parent || parent.type !== "folder") parent = desktopFolder();

        if (parent.children.some(item => item.name.toLowerCase() === entry.node.name.toLowerCase())) {
            entry.node.name = "恢复的 " + entry.node.name;
        }
        parent.children.push(entry.node);
        trash.splice(index, 1);
        saveFS();
        refreshAll();
        notify("已还原");
    }

    function restoreSelected(win) {
        const selected = win.dataset.selectedTrash;
        if (!selected) return notify("请选择要还原的删除项");
        restoreItem(selected);
    }

    function emptyTrash() {
        if (!trash.length) return notify("回收站已经是空的");
        if (!confirm("确定要永久删除回收站中的所有项目吗？")) return;
        trash = [];
        saveFS();
        refreshAll();
        notify("回收站已清空");
    }

    function refreshAll() {
        renderDesktop();
        for (const win of windows.values()) {
            if (win.dataset.app === "explorer") renderExplorer(win);
            if (win.dataset.app === "trash") renderTrash(win);
        }
    }

    function openNode(nodeId) {
        const node = findNode(nodeId);
        if (!node) return;
        if (node.type === "folder") {
            openApp("explorer", { folderId: node.id });
        } else {
            openApp("notepad", { fileId: node.id });
        }
    }

    function copyOrCut(nodeId, mode) {
        const node = findNode(nodeId);
        if (!node) return;
        clipboard = { nodeId, mode };
        notify(mode === "copy" ? "已复制" : "已剪切");
    }

    function pasteInto(parentId) {
        if (!clipboard) return notify("剪贴板为空");
        const source = findNode(clipboard.nodeId);
        const target = findNode(parentId);
        if (!source || !target || target.type !== "folder") return notify("无法粘贴");

        if (source.id === target.id || (source.type === "folder" && containsNode(source, target.id))) {
            return notify("不能将文件夹粘贴到自身内部");
        }

        if (target.children.some(item => item.name.toLowerCase() === source.name.toLowerCase())) {
            return notify("目标位置已有同名项目");
        }

        if (clipboard.mode === "cut") {
            const parent = findParent(source.id);
            if (!parent) return;
            parent.children = parent.children.filter(item => item.id !== source.id);
            target.children.push(source);
            clipboard = null;
        } else {
            target.children.push(cloneNode(source));
        }

        saveFS();
        refreshAll();
        notify("已粘贴");
    }

    function containsNode(root, targetId) {
        if (root.id === targetId) return true;
        return root.type === "folder" && root.children.some(child => containsNode(child, targetId));
    }

    function cloneNode(node) {
        const copy = { ...node, id: id() };
        if (node.type === "folder") copy.children = node.children.map(cloneNode);
        return copy;
    }

    function runExplorerCommand(win, command) {
        const folderId = win.dataset.folderId || fs.id;
        if (command === "new-folder") return createItem(folderId, "folder");
        if (command === "new-file") return createItem(folderId, "file");
        if (command === "refresh") {
            renderExplorer(win);
            return notify("已刷新");
        }
        if (command === "up") {
            const parent = findParent(folderId);
            if (parent) showFolder(win, parent.id);
            return;
        }
        if (command === "back" || command === "forward") {
            return notify("浏览器前进后退尚未实现");
        }
    }

    function goLocation(win, location) {
        if (location === "trash") return openApp("trash");
        if (location === "root") return showFolder(win, fs.id);
        const nameMap = {
            desktop: "桌面", documents: "文档", downloads: "下载", pictures: "图片"
        };
        const target = fs.children.find(item => item.name === nameMap[location]);
        if (target) showFolder(win, target.id);
    }

    function noteCommand(win, command) {
        const textarea = $(".notepad-text", win);
        if (command === "new") {
            win.dataset.fileId = "";
            textarea.value = "";
            $("[data-note-name]", win).textContent = "未命名.txt";
            textarea.focus();
            return;
        }

        if (command === "save") {
            const fileId = win.dataset.fileId;
            let node = fileId && findNode(fileId);
            if (!node) {
                const name = prompt("保存为文件名：", "新建文本文档.txt");
                if (name === null || !name.trim()) return;
                const parent = desktopFolder();
                node = file(name.trim(), textarea.value);
                parent.children.push(node);
                win.dataset.fileId = node.id;
                $("[data-note-name]", win).textContent = node.name;
            } else {
                node.content = textarea.value;
            }
            saveFS();
            refreshAll();
            notify("文件已保存");
        }
    }

    function loadTextFile(win, fileId) {
        const node = findNode(fileId);
        if (!node || node.type !== "file") return;
        win.dataset.fileId = node.id;
        $(".notepad-text", win).value = node.content || "";
        $("[data-note-name]", win).textContent = node.name;
    }

    function calculatorKey(win, key) {
        const display = $(".calc-display", win);
        let value = display.value;
        const map = { "÷": "/", "×": "*", "−": "-" };

        if (key === "C") return display.value = "0";
        if (key === "⌫") return display.value = value.length > 1 ? value.slice(0, -1) : "0";
        if (key === "±") return display.value = String(Number(value) * -1);

        if (key === "=") {
            try {
                let expression = value.replace(/[÷×−]/g, ch => map[ch]);
                if (!/^[0-9+*/().% -]+$/.test(expression)) throw new Error();
                const result = Function('"use strict";return (' + expression + ')')();
                display.value = Number.isFinite(result) ? String(Number(result.toFixed(10))) : "错误";
            } catch {
                display.value = "错误";
            }
            return;
        }

        const mapped = map[key] || key;
        display.value = value === "0" || value === "错误"
            ? (/^[0-9.]$/.test(mapped) ? mapped : value + mapped)
            : value + mapped;
    }

    function showContextMenu(x, y, state) {
        contextState = state;
        const menu = $("#contextMenu");
        const node = state.nodeId ? findNode(state.nodeId) : null;

        let html = "";
        if (node) {
            html += `<button data-action="open">📂 打开</button>
            <button data-action="rename">✏️ 重命名</button>
            <button data-action="copy">📄 复制</button>
            <button data-action="cut">✂️ 剪切</button>
            <button data-action="delete">🗑️ 删除</button><div class="separator"></div>`;
        }
        html += `<button data-action="new-folder">📁 新建文件夹</button>
        <button data-action="new-file">📄 新建文本文档</button>
        <button data-action="paste">📋 粘贴</button>
        <div class="separator"></div>
        <button data-action="refresh">🔄 刷新</button>
        <button data-action="settings">⚙️ 设置</button>`;

        menu.innerHTML = html;
        menu.style.left = Math.min(x, innerWidth - 220) + "px";
        menu.style.top = Math.min(y, innerHeight - 250) + "px";
        menu.classList.add("show");
    }

    $("#contextMenu").addEventListener("click", event => {
        const button = event.target.closest("[data-action]");
        if (!button || !contextState) return;
        const action = button.dataset.action;
        const state = contextState;
        $("#contextMenu").classList.remove("show");

        const destination = state.place === "desktop" ? desktopFolder().id : state.folderId;
        if (action === "open" && state.nodeId) return openNode(state.nodeId);
        if (action === "rename" && state.nodeId) return renameItem(state.nodeId);
        if (action === "delete" && state.nodeId) return deleteItem(state.nodeId);
        if (action === "copy" && state.nodeId) return copyOrCut(state.nodeId, "copy");
        if (action === "cut" && state.nodeId) return copyOrCut(state.nodeId, "cut");
        if (action === "new-folder") return createItem(destination, "folder");
        if (action === "new-file") return createItem(destination, "file");
        if (action === "paste") return pasteInto(destination);
        if (action === "refresh") return refreshAll();
        if (action === "settings") return openApp("settings");
    });

    $("#desktop").addEventListener("contextmenu", event => {
        event.preventDefault();
        const item = event.target.closest("[data-node]");
        showContextMenu(event.clientX, event.clientY, {
            place: "desktop",
            nodeId: item?.dataset.node || null,
            folderId: desktopFolder().id
        });
    });

    $("#desktop").addEventListener("click", event => {
        const icon = event.target.closest(".desktop-icon");
        $$(".desktop-icon").forEach(item => item.classList.toggle("selected", item === icon));
        if (event.detail === 2 && icon) {
            if (icon.dataset.app) openApp(icon.dataset.app);
            else if (icon.dataset.node) openNode(icon.dataset.node);
        }
    });

    $("#startButton").addEventListener("click", () => {
        closePanels();
        $("#startMenu").classList.toggle("show");
    });

    $("#quickButton").addEventListener("click", () => {
        closePanels();
        $("#quickPanel").classList.toggle("show");
    });

    $("#clockButton").addEventListener("click", () => {
        closePanels();
        $("#notifications").classList.toggle("show");
    });

    $("#appGrid").addEventListener("click", event => {
        const button = event.target.closest("[data-app]");
        if (button) openApp(button.dataset.app);
    });

    $$("[data-launch]").forEach(button => button.addEventListener("click", () => {
        const appName = button.dataset.launch;
        const win = windows.get(appName);
        if (win && !win.classList.contains("minimized")) {
            win.classList.add("minimized");
            updateTaskbar();
        } else {
            openApp(appName);
        }
    }));

    $("#startSearch").addEventListener("input", event => {
        const query = event.target.value.toLowerCase().trim();
        $$(".app-item").forEach(item => {
            item.style.display = item.dataset.name.toLowerCase().includes(query) ? "" : "none";
        });
    });

    $("#taskSearch").addEventListener("click", () => {
        closePanels();
        $("#startMenu").classList.add("show");
        $("#startSearch").focus();
    });

    $("#allApps").addEventListener("click", () => {
        $("#startSearch").value = "";
        $$(".app-item").forEach(item => item.style.display = "");
        $("#startSearch").focus();
    });

    $("#quickPanel").addEventListener("click", event => {
        const tile = event.target.closest(".quick-tile");
        if (tile) tile.classList.toggle("on");
    });

    $("#clearNotifications").addEventListener("click", () => {
        $("#notificationCard").textContent = "没有新的通知。";
    });

    $("#powerButton").addEventListener("click", () => notify("模拟器不能关闭或重启电脑"));

    document.addEventListener("pointerdown", event => {
        if (!event.target.closest(".panel") &&
            !event.target.closest("#startButton") &&
            !event.target.closest(".tray") &&
            !event.target.closest("#taskSearch")) {
            $$(".panel").forEach(panel => panel.classList.remove("show"));
        }
        if (!event.target.closest(".context-menu")) $("#contextMenu").classList.remove("show");
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") closePanels();
        if (event.key === "Delete") {
            const focused = $(".window.focused");
            const selected = focused?.dataset.selectedFile;
            if (selected) deleteItem(selected);
        }
        if (event.key === "Enter" && event.target === $("#startSearch")) {
            const first = $$(".app-item").find(item => item.style.display !== "none");
            if (first) openApp(first.dataset.app);
        }
    });

    function setWallpaper(name) {
        document.body.classList.remove("wall-purple", "wall-green");
        if (name === "purple") document.body.classList.add("wall-purple");
        if (name === "green") document.body.classList.add("wall-green");
        localStorage.setItem("web-windows-wallpaper", name);
        notify("桌面壁纸已更换");
    }

    function updateClock() {
        const now = new Date();
        $("#clockTime").textContent = now.toLocaleTimeString("zh‑CN", {
            hour: "2‑digit", minute: "2‑digit"
        });
        $("#clockDate").textContent = now.toLocaleDateString("zh‑CN", {
            year: "numeric", month: "2‑digit", day: "2‑digit"
        });
    }

    if (localStorage.getItem("web-windows-dark") === "true") {
        document.body.classList.add("dark");
    }
    const savedWallpaper = localStorage.getItem("web-windows-wallpaper");
    if (savedWallpaper) setWallpaper(savedWallpaper);

    renderDesktop();
    updateClock();
    setInterval(updateClock, 1000);

})();
</script>
</body>
</html>
