<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Web 桌面</title>
    <style>
    :root {
        --text: #20232b;
        --muted: #6b7280;
        --panel: rgba(248, 249, 253, .95);
        --taskbar: rgba(241, 243, 249, .82);
        --window-bg: #f7f8fb;
        --content-bg: #fff;
        --accent: #527df3;
        --line: rgba(110, 120, 140, .18);
        --shadow: 0 18px 60px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background:
            radial-gradient(ellipse at 68% 48%, #4da6ff 0%, transparent 30%),
            radial-gradient(ellipse at 54% 50%, #6470ff 0%, transparent 33%),
            radial-gradient(ellipse at 30% 64%, #414dd1 0%, transparent 34%),
            linear-gradient(135deg, #123f86, #171b58 55%, #071326);
    }

    body.dark {
        --text: #f1f3f8;
        --muted: #b6bece;
        --panel: rgba(32, 36, 48, .96);
        --taskbar: rgba(25, 29, 39, .86);
        --window-bg: #242833;
        --content-bg: #1d2028;
        --line: rgba(255,255,255,.13);
        --shadow: 0 18px 60px rgba(0, 0, 0, .5);
    }

    body.wall-purple {
        background:
            radial-gradient(ellipse at 68% 48%, #f7a4ff 0%, transparent 30%),
            radial-gradient(ellipse at 54% 50%, #8878f5 0%, transparent 34%),
            radial-gradient(ellipse at 30% 64%, #552ca6 0%, transparent 35%),
            linear-gradient(135deg, #542a8e, #211c5c 55%, #110c2d);
    }

    body.wall-green {
        background:
            radial-gradient(ellipse at 68% 48%, #98f3b2 0%, transparent 30%),
            radial-gradient(ellipse at 54% 50%, #51c7a6 0%, transparent 34%),
            radial-gradient(ellipse at 30% 64%, #247e88 0%, transparent 35%),
            linear-gradient(135deg, #145d63, #143749 55%, #071d2b);
    }

    button, input, textarea, select { font: inherit; }
    button { color: inherit; }

    .desktop {
        position: absolute;
        inset: 0 0 48px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-content: flex-start;
        flex-wrap: wrap;
        gap: 5px;
        overflow: auto;
    }

    .desktop-icon {
        width: 86px;
        min-height: 82px;
        padding: 7px 4px;
        border: 1px solid transparent;
        border-radius: 5px;
        color: #fff;
        text-align: center;
        text-shadow: 0 1px 3px #000;
        font-size: 12px;
        cursor: default;
    }

    .desktop-icon:hover, .desktop-icon.selected {
        background: rgba(255,255,255,.18);
        border-color: rgba(255,255,255,.2);
    }

    .desktop-icon .icon {
        display: block;
        margin-bottom: 5px;
        font-size: 32px;
        line-height: 38px;
    }

    .taskbar {
        position: fixed;
        z-index: 5000;
        inset: auto 0 0;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--taskbar);
        border-top: 1px solid rgba(255,255,255,.4);
        backdrop-filter: blur(24px);
        color: var(--text);
    }

    .taskbar-center { height: 100%; display: flex; align-items: center; gap: 3px; }

    .task-button {
        position: relative;
        width: 42px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        font-size: 20px;
    }

    .task-button:hover, .task-button.active { background: rgba(128,140,165,.18); }
    .task-button.open::after {
        content: "";
        position: absolute;
        bottom: 1px;
        left: 16px;
        width: 10px;
        height: 3px;
        border-radius: 4px;
        background: var(--accent);
    }

    .win-logo {
        width: 21px;
        height: 21px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
        transform: skewY(-5deg);
    }
    .win-logo i { background: #1684f8; }

    .task-search {
        width: 175px;
        height: 33px;
        padding: 0 11px;
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 18px;
        color: var(--text);
        background: rgba(255,255,255,.58);
        cursor: text;
        font-size: 12px;
    }
    body.dark .task-search { background: rgba(255,255,255,.1); }
    .task-search input {
        width: 100%;
        border: 0;
        outline: 0;
        color: inherit;
        background: transparent;
    }

    .tray {
        position: absolute;
        right: 8px;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 3px;
    }

    .tray button {
        min-width: 35px;
        height: 38px;
        padding: 0 6px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: transparent;
        cursor: pointer;
    }
    .tray button:hover { background: rgba(128,140,165,.18); }
    .clock { min-width: 76px; text-align: center; font-size: 11px; line-height: 1.35; }

    .panel, .context-menu {
        display: none;
        position: fixed;
        z-index: 4500;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(25px);
    }
    .panel.show, .context-menu.show { display: block; }

    .start-menu {
        left: 50%;
        bottom: 57px;
        transform: translateX(-50%);
        width: min(570px, calc(100vw - 16px));
        max-height: calc(100vh - 65px);
        overflow: auto;
        padding: 20px 24px 16px;
    }

    .start-search {
        width: 100%;
        height: 39px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-bottom: 2px solid var(--accent);
        border-radius: 5px;
        outline: 0;
        color: var(--text);
        background: rgba(255,255,255,.5);
    }
    body.dark .start-search { background: rgba(255,255,255,.1); }

    .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 20px 2px 10px;
        font-size: 14px;
        font-weight: 600;
    }

    .heading button, .small-button {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: rgba(128,140,165,.1);
        cursor: pointer;
        font-size: 11px;
    }

    .app-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
    .app-item {
        min-height: 78px;
        padding: 8px 3px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: transparent;
        cursor: pointer;
        font-size: 11px;
    }
    .app-item:hover { background: rgba(128,140,165,.16); }
    .app-item .icon { font-size: 27px; }

    .start-footer {
        margin: 18px -24px -16px;
        padding: 11px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(128,140,165,.1);
        font-size: 12px;
    }
    .user { display: flex; align-items: center; gap: 9px; }
    .avatar {
        width: 29px; height: 29px; display: grid; place-items: center;
        border-radius: 50%; color: white; background: linear-gradient(135deg,#80b8ff,#526ee7);
    }

    .quick-panel, .notifications {
        right: 10px;
        bottom: 57px;
        width: min(335px, calc(100vw - 16px));
        padding: 15px;
    }

    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-tile {
        min-height: 48px;
        padding: 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: rgba(128,140,165,.15);
        cursor: pointer;
        text-align: left;
        font-size: 12px;
    }
    .quick-tile.on { color: white; background: #5578df; }
    .slider-row { margin-top: 14px; display: flex; align-items: center; gap: 9px; }
    .slider-row input { width: 100%; accent-color: var(--accent); }
    .notification {
        margin-top: 10px;
        padding: 12px;
        border-radius: 6px;
        background: rgba(128,140,165,.13);
        font-size: 12px;
        line-height: 1.55;
    }

    .window {
        position: absolute;
        z-index: 100;
        top: 80px;
        left: 50%;
        width: min(820px, calc(100vw - 24px));
        height: min(550px, calc(100vh - 100px));
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 8px;
        color: var(--text);
        background: var(--window-bg);
        box-shadow: var(--shadow);
    }
    .window.show { display: flex; }
    .window.minimized { display: none; }
    .window.maximized {
        inset: 5px 5px 53px !important;
        width: auto !important;
        height: auto !important;
        transform: none !important;
    }
    .window.focused {
        border-color: rgba(82,125,243,.55);
        box-shadow: 0 22px 70px rgba(0,0,0,.34);
    }

    .titlebar {
        height: 38px;
        min-height: 38px;
        padding-left: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--window-bg);
        cursor: move;
        touch-action: none;
    }
    .window-title { display: flex; gap: 8px; align-items: center; font-size: 12px; }
    .window-controls { height: 100%; display: flex; }
    .window-controls button {
        width: 43px;
        border: 0;
        color: inherit;
        background: transparent;
        cursor: pointer;
    }
    .window-controls button:hover { background: rgba(128,140,165,.18); }
    .window-controls .close:hover { color: white; background: #c42b1c; }
    .window-content { flex: 1; min-height: 0; overflow: auto; background: var(--content-bg); }

    .toolbar {
        min-height: 43px;
        padding: 5px 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid var(--line);
    }
    .tool {
        min-width: 32px;
        height: 30px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        color: inherit;
        background: transparent;
        cursor: pointer;
    }
    .tool:hover { background: rgba(128,140,165,.17); }
    .address {
        flex: 1;
        min-width: 70px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(128,140,165,.07);
        font-size: 12px;
    }

    .explorer-layout { height: calc(100% - 43px); display: flex; }
    .sidebar {
        width: 165px;
        flex: 0 0 165px;
        padding: 10px 7px;
        border-right: 1px solid var(--line);
    }
    .nav-item {
        padding: 9px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }
    .nav-item:hover, .nav-item.selected { background: rgba(128,140,165,.15); }
    .files-area { flex: 1; padding: 18px; overflow: auto; }
    .files-heading { margin: 0 0 15px; font-size: 18px; font-weight: 500; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(105px,1fr)); gap: 8px; }
    .file-item {
        min-height: 85px;
        padding: 10px 5px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 5px;
        text-align: center;
        cursor: default;
        font-size: 12px;
        overflow-wrap: anywhere;
    }
    .file-item:hover, .file-item.selected {
        border-color: rgba(82,125,243,.35);
        background: rgba(82,125,243,.09);
    }
    .file-item .icon { display: block; margin-bottom: 6px; font-size: 30px; }
    .empty { color: var(--muted); font-size: 13px; }

    .notepad-wrap { height: 100%; display: flex; flex-direction: column; }
    .notepad-menu {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
    }
    .notepad-text {
        flex: 1;
        width: 100%;
        padding: 14px;
        resize: none;
        border: 0;
        outline: 0;
        color: var(--text);
        background: var(--content-bg);
        font: 14px/1.6 Consolas, monospace;
        user-select: text;
    }

    .settings { max-width: 680px; padding: 26px; }
    .settings h2 { font-weight: 500; }
    .setting-card {
        margin: 12px 0;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(128,140,165,.06);
        font-size: 13px;
    }
    .setting-card p { color: var(--muted); font-size: 12px; }
    .setting-card button {
        margin: 3px;
        padding: 8px 11px;
        border: 0;
        border-radius: 5px;
        color: inherit;
        background: rgba(82,125,243,.16);
        cursor: pointer;
    }

    .calc { width: min(340px,100%); margin: 18px auto; padding: 10px; }
    .calc-display {
        width: 100%; height: 75px; padding: 10px;
        border: 0; outline: 0; color: inherit; background: transparent;
        text-align: right; font-size: 34px;
    }
    .calc-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; }
    .calc-key {
        height: 50px; border: 1px solid var(--line); border-radius: 5px;
        color: inherit; background: rgba(128,140,165,.1); cursor: pointer;
    }
    .calc-key:hover { background: rgba(128,140,165,.23); }
    .calc-key.equals { color: white; background: var(--accent); }

    /* ---------- 浏览器 ---------- */
    .browser-wrap { height: 100%; display: flex; flex-direction: column; }
    .browser-bookmarks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
    }
    .bm-card {
        min-width: 0;
        padding: 9px 4px 7px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        background: rgba(128,140,165,.08);
        cursor: pointer;
        font-size: 11px;
        text-align: center;
        transition: .15s;
    }
    .bm-card:hover {
        background: rgba(82,125,243,.16);
        border-color: rgba(82,125,243,.45);
        transform: translateY(-1px);
    }
    .bm-card .bm-icon { font-size: 22px; line-height: 1.2; }
    .bm-card .bm-name {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .browser-frame {
        flex: 1;
        width: 100%;
        border: 0;
        background: #fff;
    }
    .browser-tip {
        padding: 4px 10px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid var(--line);
    }

    /* ---------- 终端 ---------- */
    .terminal {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #0c0c14;
        color: #d6e2ff;
        font: 13px/1.6 Consolas, "Courier New", monospace;
    }
    .term-output {
        flex: 1;
        overflow: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
    }
    .term-row { display: flex; gap: 8px; padding: 0 14px 12px; }
    .term-prompt { color: #7ecbff; white-space: nowrap; }
    .term-input {
        flex: 1;
        border: 0; outline: 0;
        background: transparent;
        color: #d6e2ff;
        font: inherit;
    }

    /* ---------- 画图 ---------- */
    .paint-wrap { height: 100%; display: flex; flex-direction: column; }
    .paint-canvas-area {
        flex: 1;
        overflow: auto;
        display: grid;
        place-items: center;
        background:
            repeating-conic-gradient(rgba(128,140,165,.08) 0% 25%, transparent 0% 50%) 0 0 / 20px 20px;
    }
    .paint-canvas {
        background: #fff;
        border: 1px solid var(--line);
        cursor: crosshair;
        touch-action: none;
        max-width: 100%;
    }
    .paint-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .paint-controls label { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .paint-controls input[type="color"] {
        width: 32px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: transparent;
    }

    /* ---------- 扫雷 ---------- */
    .mine-wrap { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .mine-status { font-size: 13px; display: flex; gap: 16px; align-items: center; }
    .mine-grid {
        display: grid;
        grid-template-columns: repeat(9, 30px);
        gap: 2px;
    }
    .mine-cell {
        width: 30px; height: 30px;
        display: grid; place-items: center;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(128,140,165,.14);
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        user-select: none;
    }
    .mine-cell:hover { background: rgba(82,125,243,.18); }
    .mine-cell.open { background: rgba(128,140,165,.05); cursor: default; }
    .mine-cell.boom { background: #e8564d; color: #fff; }
    .mine-n1 { color: #2f6fd0; } .mine-n2 { color: #2e8b47; } .mine-n3 { color: #d0483e; }
    .mine-n4 { color: #6a3bbd; } .mine-n5 { color: #a8642a; } .mine-n6 { color: #1d8f8f; }
    .mine-n7 { color: #444; } .mine-n8 { color: #888; }

    /* ---------- 任务管理器 ---------- */
    .taskmgr { padding: 14px; }
    .taskmgr table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .taskmgr th, .taskmgr td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
    .taskmgr tr[data-task-app] { cursor: pointer; }
    .taskmgr tr.selected { background: rgba(82,125,243,.12); }
    .taskmgr-actions { margin-top: 12px; display: flex; gap: 8px; }

    /* ---------- 日历 ---------- */
    .calendar { max-width: 420px; margin: 18px auto; padding: 10px; }
    .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 12px; }
    .cal-grid .cal-wd { color: var(--muted); padding: 5px 0; font-weight: 600; }
    .cal-day {
        padding: 9px 0;
        border-radius: 6px;
        cursor: default;
    }
    .cal-day.today { color: #fff; background: var(--accent); font-weight: 600; }
    .cal-day.dim { color: var(--muted); opacity: .55; }

    /* ---------- 媒体播放器 ---------- */
    .media { max-width: 460px; margin: 16px auto; padding: 12px; }
    .media-now {
        padding: 26px 16px;
        border-radius: 10px;
        text-align: center;
        background: linear-gradient(135deg, rgba(82,125,243,.25), rgba(130,90,240,.2));
        margin-bottom: 12px;
    }
    .media-now .disc { font-size: 44px; display: inline-block; }
    .media-now.playing .disc { animation: spin 3.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .media-track {
        width: 100%;
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        border: 0;
        border-radius: 6px;
        background: rgba(128,140,165,.1);
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 5px;
        text-align: left;
    }
    .media-track:hover { background: rgba(82,125,243,.16); }

    /* ---------- 照片查看器 ---------- */
    .photo-view { height: 100%; display: grid; place-items: center; padding: 16px; }
    .photo-view img {
        max-width: 100%;
        max-height: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: var(--shadow);
    }

    .context-menu {
        width: 210px;
        padding: 5px;
        z-index: 7000;
    }
    .context-menu button {
        width: 100%;
        padding: 8px 9px;
        display: block;
        border: 0;
        border-radius: 4px;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
        font-size: 12px;
    }
    .context-menu button:hover { background: rgba(128,140,165,.17); }
    .context-menu .separator { height: 1px; margin: 4px; background: var(--line); }

    .toast {
        position: fixed;
        z-index: 8000;
        right: 16px;
        bottom: 58px;
        max-width: min(350px, calc(100vw - 32px));
        padding: 12px 15px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        background: var(--panel);
        box-shadow: var(--shadow);
        font-size: 12px;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
        .task-search { width: 38px; justify-content: center; padding: 0; }
        .task-search input { display: none; }
        .taskbar-center { transform: translateX(-18px); }
        .app-grid { grid-template-columns: repeat(4,1fr); }
        .sidebar { width: 120px; flex-basis: 120px; }
        .browser-bookmarks { grid-template-columns: repeat(2, 1fr); }
        .mine-grid { grid-template-columns: repeat(9, 24px); }
        .mine-cell { width: 24px; height: 24px; font-size: 12px; }
    }
    @media (max-width: 390px) {
        .app-grid { grid-template-columns: repeat(3,1fr); }
        .task-button { width: 36px; }
        .taskbar-center { gap: 0; }
        .sidebar { width: 98px; flex-basis: 98px; }
    }
    </style>
</head>
<body>
    <main class="desktop" id="desktop"></main>

    <section class="panel start-menu" id="startMenu">
        <input class="start-search" id="startSearch" placeholder="搜索应用和文件" autocomplete="off">
        <div class="heading"><span>已固定</span><button id="allApps">所有应用 </button></div>
        <div class="app-grid" id="appGrid">
            <button class="app-item" data-app="explorer" data-name="文件资源管理器">
                <span class="icon">📂</span><span>文件资源管理器</span>
            </button>
            <button class="app-item" data-app="browser" data-name="浏览器 网络 Edge">
                <span class="icon">🌐</span><span>浏览器</span>
            </button>
            <button class="app-item" data-app="notepad" data-name="记事本 文本">
                <span class="icon">📄</span><span>记事本</span>
            </button>
            <button class="app-item" data-app="calculator" data-name="计算器">
                <span class="icon">🧮</span><span>计算器</span>
            </button>
            <button class="app-item" data-app="paint" data-name="画图 绘画 绘图">
                <span class="icon">🎨</span><span>画图</span>
            </button>
            <button class="app-item" data-app="terminal" data-name="终端 命令行 cmd">
                <span class="icon">⌨️</span><span>终端</span>
            </button>
            <button class="app-item" data-app="minesweeper" data-name="扫雷 游戏">
                <span class="icon">💣</span><span>扫雷</span>
            </button>
            <button class="app-item" data-app="calendar" data-name="日历 日期">
                <span class="icon">📅</span><span>日历</span>
            </button>
            <button class="app-item" data-app="media" data-name="音乐 媒体播放器">
                <span class="icon">🎵</span><span>音乐</span>
            </button>
            <button class="app-item" data-app="taskmgr" data-name="任务管理器 进程">
                <span class="icon">📊</span><span>任务管理器</span>
            </button>
            <button class="app-item" data-app="settings" data-name="设置 个性化">
                <span class="icon">⚙️</span><span>设置</span>
            </button>
            <button class="app-item" data-app="trash" data-name="回收站">
                <span class="icon">🗑️</span><span>回收站</span>
            </button>
            <button class="app-item" data-app="about" data-name="关于">
                <span class="icon">ℹ️</span><span>关于</span>
            </button>
        </div>
        <div class="start-footer">
            <div class="user"><span class="avatar">👤</span><span>用户</span></div>
            <button class="small-button" id="powerButton">🔒 关机</button>
        </div>
    </section>

    <section class="panel quick-panel" id="quickPanel">
        <div class="quick-grid">
            <button class="quick-tile on">📶 Wi‑Fi</button>
            <button class="quick-tile on">🔔 蓝牙</button>
            <button class="quick-tile">🌙 勿扰模式</button>
            <button class="quick-tile on">🔆 夜灯模式</button>
        </div>
        <div class="slider-row">💡 <input type="range" min="20" max="100" value="80"></div>
        <div class="slider-row">🔊 <input type="range" min="0" max="100" value="65"></div>
        <p style="font-size:12px;color:var(--muted)">🔊 音量 · 点击关机按钮关机</p>
    </section>

    <section class="panel notifications" id="notifications">
        <div class="heading" style="margin-top:0"><span>通知</span><button id="clearNotifications">清除全部</button></div>
        <div class="notification" id="notificationCard"><b>ℹ️ 欢迎使用 Windows</b><br>文件保存在浏览器本地存储中。新增浏览器、画图、终端、扫雷等应用。</div>
        <div class="notification">用画图画的图片会保存到桌面，双击即可查看。</div>
    </section>

    <div class="context-menu" id="contextMenu"></div>
    <div class="toast" id="toast"></div>

    <footer class="taskbar">
        <div class="taskbar-center">
            <button class="task-button" id="startButton" title="打开开始菜单">
                <span class="win-logo"><i></i><i></i><i></i><i></i></span>
            </button>
            <label class="task-search" id="taskSearch">🔍 <input id="taskSearchInput" placeholder="搜索"></label>
            <button class="task-button" data-launch="explorer" title="文件资源管理器">📂</button>
            <button class="task-button" data-launch="browser" title="浏览器">🌐</button>
            <button class="task-button" data-launch="notepad" title="记事本">📄</button>
            <button class="task-button" data-launch="calculator" title="计算器">🧮</button>
            <button class="task-button" data-launch="minesweeper" title="扫雷">💣</button>
        </div>
        <div class="tray">
            <button id="quickButton" title="快速设置">⚙ 📶 🔊 🔔</button>
            <button class="clock" id="clockButton" title="通知和日历">
                <div id="clockTime"></div><div id="clockDate"></div>
            </button>
        </div>
    </footer>

    <script>
    (() => {
        "use strict";

        const $ = (s, root = document) => root.querySelector(s);
        const $$ = (s, root = document) => [...root.querySelectorAll(s)];
        const STORAGE_KEY = "web-windows-fs-v2";
        const TRASH_KEY = "web-windows-trash-v2";

        const apps = {
            explorer: { title: "文件资源管理器", icon: "📂" },
            browser: { title: "浏览器", icon: "🌐" },
            notepad: { title: "记事本", icon: "📄" },
            calculator: { title: "计算器", icon: "🧮" },
            paint: { title: "画图", icon: "🎨" },
            terminal: { title: "终端", icon: "⌨️" },
            minesweeper: { title: "扫雷", icon: "💣" },
            calendar: { title: "日历", icon: "📅" },
            media: { title: "音乐播放器", icon: "🎵" },
            taskmgr: { title: "任务管理器", icon: "📊" },
            settings: { title: "设置", icon: "⚙️" },
            trash: { title: "回收站", icon: "🗑️" },
            photos: { title: "照片查看器", icon: "🖼️" },
            about: { title: "关于 Windows Web", icon: "ℹ️" }
        };

        const BOOKMARKS = [
            { icon: "🚪", name: "后室游戏", url: "https://soolinejiang.github.io/backroom/" },
            { icon: "🏫", name: "班级网站", url: "http://soolinesauce.dpdns.org/" },
            { icon: "⛅", name: "天气预报", url: "https://soolinejiang.github.io/tqyb/" },
            { icon: "🌟", name: "soolineの个人站", url: "https://cnman.gt.tc" }
        ];

        function id() {
            return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function folder(name, children = []) {
            return { id: id(), name, type: "folder", children };
        }

        function file(name, content = "") {
            return { id: id(), name, type: "file", content };
        }

        function makeInitialFS() {
            return folder("此电脑", [
                folder("桌面", [
                    folder("新建文件夹"),
                    file("欢迎使用.txt", "欢迎使用 Windows Web 桌面！\n\n你可以在桌面新建文件和文件夹。\n试试浏览器、画图、终端和扫雷吧。")
                ]),
                folder("文档"),
                folder("下载"),
                folder("图片"),
                folder("音乐"),
                folder("视频"),
                folder("本地磁盘 (C:)"),
                folder("本地磁盘 (D:)")
            ]);
        }

        function readJSON(key, fallback) {
            try {
                const value = JSON.parse(localStorage.getItem(key));
                return value || fallback;
            } catch {
                return fallback;
            }
        }

        let fs = readJSON(STORAGE_KEY, null);
        if (!fs || fs.type !== "folder" || !Array.isArray(fs.children)) fs = makeInitialFS();
        let trash = readJSON(TRASH_KEY, []);
        if (!Array.isArray(trash)) trash = [];

        const windows = new Map();
        let zIndex = 100;
        let clipboard = null;
        let toastTimer;
        let contextState = null;

        function saveFS() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(fs));
            localStorage.setItem(TRASH_KEY, JSON.stringify(trash));
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[ch]));
        }

        function findNode(nodeId, node = fs) {
            if (node.id === nodeId) return node;
            if (node.type === "folder") {
                for (const child of node.children) {
                    const found = findNode(nodeId, child);
                    if (found) return found;
                }
            }
            return null;
        }

        function findParent(nodeId, node = fs) {
            if (node.type !== "folder") return null;
            for (const child of node.children) {
                if (child.id === nodeId) return node;
                const found = findParent(nodeId, child);
                if (found) return found;
            }
            return null;
        }

        function desktopFolder() {
            return fs.children.find(item => item.name === "桌面" && item.type === "folder") || fs;
        }

        function iconFor(node) {
            if (node.type === "folder") return "📁";
            if (/\.txt$/i.test(node.name)) return "📄";
            if (/\.(png|jpe?g|gif|webp|bmp)$/i.test(node.name)) return "🖼️";
            return "📃";
        }

        function notify(message) {
            const toast = $("#toast");
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
        }

        function closePanels() {
            $$(".panel").forEach(panel => panel.classList.remove("show"));
            $("#contextMenu").classList.remove("show");
        }

        function renderDesktop() {
            const desktop = $("#desktop");
            const items = desktopFolder().children;
            desktop.innerHTML = `
                <div class="desktop-icon" data-app="explorer"><span class="icon">📂</span>此电脑</div>
                <div class="desktop-icon" data-app="browser"><span class="icon">🌐</span>浏览器</div>
                <div class="desktop-icon" data-app="notepad"><span class="icon">📄</span>记事本</div>
                <div class="desktop-icon" data-app="calculator"><span class="icon">🧮</span>计算器</div>
                <div class="desktop-icon" data-app="paint"><span class="icon">🎨</span>画图</div>
                <div class="desktop-icon" data-app="terminal"><span class="icon">⌨️</span>终端</div>
                <div class="desktop-icon" data-app="minesweeper"><span class="icon">💣</span>扫雷</div>
                <div class="desktop-icon" data-app="trash"><span class="icon">${trash.length ? "🗑️" : "🗳️"}</span>回收站</div>
                ${items.map(item => `
                    <div class="desktop-icon" data-node="${escapeHTML(item.id)}">
                        <span class="icon">${iconFor(item)}</span>${escapeHTML(item.name)}
                    </div>`).join("")}`;
        }

        function getExplorerContent() {
            return `
                <div class="toolbar">
                    <button class="tool" data-command="back" title="返回">←</button>
                    <button class="tool" data-command="forward" title="前进">→</button>
                    <button class="tool" data-command="up" title="上一级">↑</button>
                    <div class="address" data-address>📂 此电脑</div>
                    <input class="address" data-filter placeholder="搜索此电脑中的文件" style="max-width:190px">
                    <button class="tool" data-command="new-folder" title="新建文件夹">📁➕</button>
                    <button class="tool" data-command="new-file" title="新建文本文档">📄➕</button>
                    <button class="tool" data-command="refresh" title="刷新">⟳</button>
                </div>
                <div class="explorer-layout">
                    <aside class="sidebar">
                        <div class="nav-item selected" data-location="root">📂 此电脑</div>
                        <div class="nav-item" data-location="desktop">🖥️ 桌面</div>
                        <div class="nav-item" data-location="documents">📄 文档</div>
                        <div class="nav-item" data-location="downloads">📥 下载</div>
                        <div class="nav-item" data-location="pictures">🖼️ 图片</div>
                        <div class="nav-item" data-location="trash">🗑️ 回收站</div>
                    </aside>
                    <div class="files-area" data-files-area></div>
                </div>`;
        }

        function getBrowserHome() {
            const links = BOOKMARKS.map(b =>
                `<a href="${b.url}">${b.icon} ${b.name}</a>`).join("");
            return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
                body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;
                background:linear-gradient(135deg,#1b3a75,#241b58 55%,#0a1226);color:#fff}
                .card{text-align:center;padding:34px 42px;border-radius:16px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}
                h1{margin:0 0 6px;font-size:26px} p{margin:0 0 20px;color:#b9c6e4;font-size:13px}
                a{display:inline-block;margin:5px;padding:9px 16px;border-radius:8px;background:rgba(255,255,255,.14);
                color:#fff;text-decoration:none;font-size:13px}
                a:hover{background:rgba(255,255,255,.26)}
            </style></head><body><div class="card">
                <h1>🌐 Web 浏览器</h1>
                <p>在上方地址栏输入网址，或点击下面的快捷入口</p>
                ${links}
            </div></body></html>`;
        }

        function getBrowserContent() {
            const cards = BOOKMARKS.map(b => `
                    <button class="bm-card" data-browse-url="${escapeHTML(b.url)}">
                        <span class="bm-icon">${b.icon}</span><span class="bm-name">${escapeHTML(b.name)}</span>
                    </button>`).join("");
            return `<div class="browser-wrap">
                <div class="toolbar">
                    <button class="tool" data-browser="back" title="后退">←</button>
                    <button class="tool" data-browser="forward" title="前进">→</button>
                    <button class="tool" data-browser="reload" title="刷新">⟳</button>
                    <button class="tool" data-browser="home" title="主页">🏠</button>
                    <input class="address" data-url placeholder="输入网址，例如 example.com" spellcheck="false">
                    <button class="tool" data-browser="go" title="前往">前往</button>
                    <button class="tool" data-browser="newtab" title="在系统浏览器打开">↗</button>
                </div>
                <div class="browser-bookmarks">${cards}
                </div>
                <iframe class="browser-frame" data-frame title="浏览器页面" referrerpolicy="no-referrer"></iframe>
                <div class="browser-tip">提示：部分网站禁止被内嵌显示，若页面空白请点击 ↗ 在系统浏览器中打开。</div>
            </div>`;
        }

        function openApp(appName, options = {}) {
            if (!apps[appName]) return;
            closePanels();

            let win = windows.get(appName);
            if (!win) {
                win = document.createElement("section");
                win.className = "window show";
                win.dataset.app = appName;
                win.style.left = `calc(50% - ${Math.min(windows.size * 16, 75)}px)`;
                win.style.top = `${75 + Math.min(windows.size * 18, 60)}px`;
                win.style.zIndex = ++zIndex;
                win.innerHTML = `
                    <header class="titlebar">
                        <div class="window-title"><span>${apps[appName].icon}</span><span>${apps[appName].title}</span></div>
                        <div class="window-controls">
                            <button data-window="minimize" title="最小化">-</button>
                            <button data-window="maximize" title="最大化">□</button>
                            <button class="close" data-window="close" title="关闭">×</button>
                        </div>
                    </header>
                    <div class="window-content">${contentFor(appName)}</div>`;
                document.body.appendChild(win);
                windows.set(appName, win);
                attachWindowEvents(win);
            } else {
                win.classList.remove("minimized");
                win.classList.add("show");
            }

            if (appName === "explorer" && options.folderId) {
                showFolder(win, options.folderId);
            }
            if (appName === "notepad" && options.fileId) {
                loadTextFile(win, options.fileId);
            }
            if (appName === "photos" && options.fileId) {
                loadPhoto(win, options.fileId);
            }
            if (appName === "browser" && options.url) {
                browserNavigate(win, options.url);
            }

            focusWindow(win);
            updateTaskbar();
        }

        function contentFor(appName) {
            if (appName === "explorer") return getExplorerContent();
            if (appName === "browser") return getBrowserContent();

            if (appName === "notepad") {
                return `<div class="notepad-wrap">
                    <div class="notepad-menu">
                        <button class="tool" data-note="new">新建</button>
                        <button class="tool" data-note="save">保存</button>
                        <span data-note-name>未命名.txt</span>
                    </div>
                    <textarea class="notepad-text" spellcheck="false" placeholder="在此处输入文字…"></textarea>
                </div>`;
            }

            if (appName === "calculator") {
                return `<div class="calc">
                    <input class="calc-display" value="0" readonly>
                    <div class="calc-grid">
                        ${["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="]
                        .map(key => `<button class="calc-key" data-calc="${key}">${key}</button>`).join("")}
                    </div>
                </div>`;
            }

            if (appName === "paint") {
                return `<div class="paint-wrap">
                    <div class="toolbar paint-controls">
                        <button class="tool" data-paint="save">💾 保存到桌面</button>
                        <button class="tool" data-paint="clear">🗑 清空</button>
                        <label>🖌 颜色 <input type="color" data-paint-color value="#1a73e8"></label>
                        <label>粗细 <input type="range" data-paint-size min="1" max="40" value="5" style="width:110px"></label>
                        <label><input type="checkbox" data-paint-eraser> 橡皮擦</label>
                    </div>
                    <div class="paint-canvas-area">
                        <canvas class="paint-canvas" data-paint-canvas width="640" height="420"></canvas>
                    </div>
                </div>`;
            }

            if (appName === "terminal") {
                return `<div class="terminal">
                    <div class="term-output" data-term-out>Welcome to Windows Web Terminal [版本 3.0]
    输入 help 查看可用命令。
    </div>
                    <div class="term-row"><span class="term-prompt">C:\\Users\\用户&gt;</span>
                    <input class="term-input" data-term-in autocomplete="off" spellcheck="false"></div>
                </div>`;
            }

            if (appName === "minesweeper") {
                return `<div class="mine-wrap">
                    <div class="mine-status">
                        <span data-mine-mines>💣 10</span>
                        <button class="tool" data-mine="restart" style="border:1px solid var(--line);border-radius:4px">🙂 重新开始</button>
                        <span data-mine-time>⏱ 0s</span>
                    </div>
                    <div class="mine-grid" data-mine-grid></div>
                    <p class="empty">左键翻开 · 右键插旗 · 找出全部 10 颗雷</p>
                </div>`;
            }

            if (appName === "taskmgr") {
                return `<div class="taskmgr">
                    <table>
                        <thead><tr><th>应用</th><th>CPU</th><th>内存</th><th>状态</th></tr></thead>
                        <tbody data-task-body></tbody>
                    </table>
                    <div class="taskmgr-actions">
                        <button class="small-button" data-task="end">✖ 结束任务</button>
                        <button class="small-button" data-task="refresh">⟳ 刷新</button>
                    </div>
                    <p class="empty" style="margin-top:10px">选中一行后可结束对应应用（任务管理器自身除外）。</p>
                </div>`;
            }

            if (appName === "calendar") {
                return `<div class="calendar">
                    <div class="cal-head">
                        <button class="tool" data-cal="prev" style="border:1px solid var(--line);border-radius:4px">←</button>
                        <b data-cal-title></b>
                        <button class="tool" data-cal="next" style="border:1px solid var(--line);border-radius:4px">→</button>
                    </div>
                    <div class="cal-grid" data-cal-grid></div>
                </div>`;
            }

            if (appName === "media") {
                return `<div class="media">
                    <div class="media-now" data-media-now><span class="disc">💿</span>
                        <div style="margin-top:8px;font-size:13px" data-media-title>未在播放</div></div>
                    ${MEDIA_TRACKS.map((track, i) => `<button class="media-track" data-media-play="${i}">
                        <span>🎵 ${track.name}</span><span style="color:var(--muted)">MP3</span></button>`).join("")}
                    <button class="media-track" data-media-stop="1"><span>⏹ 停止</span></button>
                </div>`;
            }

            if (appName === "photos") {
                return `<div class="photo-view"><img data-photo-img alt="图片预览"></div>`;
            }

            if (appName === "settings") {
                return `<div class="settings">
                    <h2>个性化</h2>
                    <div class="setting-card"><b>明暗模式</b><p>切换桌面的亮色和暗色主题外观。</p>
                        <button data-setting="theme">切换暗色 / 亮色模式</button></div>
                    <div class="setting-card"><b>桌面壁纸</b><p>选择一个新壁纸主题外观。</p>
                        <button data-wallpaper="blue">蓝色</button>
                        <button data-wallpaper="purple">紫色</button>
                        <button data-wallpaper="green">绿色</button></div>
                    <div class="setting-card"><b>系统</b><p>查看当前运行的应用或打开常用工具。</p>
                        <button data-open-app="taskmgr">📊 任务管理器</button>
                        <button data-open-app="terminal">⌨️ 终端</button>
                        <button data-open-app="browser">🌐 浏览器</button></div>
                    <div class="setting-card"><b>存储说明</b><p>文件保存在浏览器本地的存储空间中。清除浏览器缓存会丢失全部文件。</p></div>
                </div>`;
            }

            if (appName === "trash") {
                return `<div class="toolbar">
                    <button class="tool" data-trash="restore">还原</button>
                    <button class="tool" data-trash="empty">清空回收站</button>
                </div>
                <div class="files-area" data-trash-area></div>`;
            }

            return `<div style="max-width:550px;margin:55px auto;padding:20px;text-align:center">
                <div style="font-size:56px">ℹ️</div><h2>Windows Web 桌面</h2>
                <p style="color:var(--muted);line-height:1.7">
                    使用 HTML、CSS 和 JavaScript 编写的桌面模拟器。<br>
                    内置文件资源管理器、浏览器、记事本、画图、终端、扫雷、<br>
                    日历、音乐播放器、任务管理器等应用，可以创建和管理各类文件。
                </p><p style="color:var(--muted);font-size:12px">版本 3.1</p></div>`;
        }

        function focusWindow(win) {
            win.style.zIndex = ++zIndex;
            $$(".window").forEach(item => item.classList.remove("focused"));
            win.classList.add("focused");
        }

        function attachWindowEvents(win) {
            const titlebar = $(".titlebar", win);
            let dragging = false;
            let dx = 0;
            let dy = 0;

            win.addEventListener("pointerdown", () => focusWindow(win));
            titlebar.addEventListener("pointerdown", event => {
                if (event.target.closest(".window-controls") || win.classList.contains("maximized")) return;
                dragging = true;
                const rect = win.getBoundingClientRect();
                dx = event.clientX - rect.left;
                dy = event.clientY - rect.top;
                win.style.left = rect.left + "px";
                win.style.top = rect.top + "px";
                win.style.transform = "none";
                titlebar.setPointerCapture(event.pointerId);
            });
            titlebar.addEventListener("pointermove", event => {
                if (!dragging) return;
                win.style.left = Math.max(0, event.clientX - dx) + "px";
                win.style.top = Math.max(0, event.clientY - dy) + "px";
            });
            titlebar.addEventListener("pointerup", () => dragging = false);
            titlebar.addEventListener("pointercancel", () => dragging = false);

            win.addEventListener("click", event => {
                const action = event.target.closest("[data-window]");
                if (action) {
                    const type = action.dataset.window;
                    if (type === "close") {
                        if (win._tmTimer) clearInterval(win._tmTimer);
                        if (win._mediaStop) win._mediaStop();
                        windows.delete(win.dataset.app);
                        win.remove();
                        updateTaskbar();
                    } else if (type === "minimize") {
                        win.classList.add("minimized");
                        updateTaskbar();
                    } else if (type === "maximize") {
                        toggleMaximize(win);
                    }
                    return;
                }

                const openShortcut = event.target.closest("[data-open-app]");
                if (openShortcut) return openApp(openShortcut.dataset.openApp);

                const cmd = event.target.closest("[data-command]");
                if (cmd) return runExplorerCommand(win, cmd.dataset.command);

                const nav = event.target.closest("[data-location]");
                if (nav) return goLocation(win, nav.dataset.location);

                const fileItem = event.target.closest("[data-file-id]");
                if (fileItem) {
                    $$(".file-item", win).forEach(item => item.classList.remove("selected"));
                    fileItem.classList.add("selected");
                    win.dataset.selectedFile = fileItem.dataset.fileId;
                    if (event.detail === 2) openNode(fileItem.dataset.fileId);
                    return;
                }

                const noteAction = event.target.closest("[data-note]");
                if (noteAction) return noteCommand(win, noteAction.dataset.note);

                const calcKey = event.target.closest("[data-calc]");
                if (calcKey) return calculatorKey(win, calcKey.dataset.calc);

                const browserBtn = event.target.closest("[data-browser]");
                if (browserBtn) return browserCommand(win, browserBtn.dataset.browser);

                const bookmark = event.target.closest("[data-browse-url]");
                if (bookmark) return browserNavigate(win, bookmark.dataset.browseUrl);

                const paintBtn = event.target.closest("[data-paint]");
                if (paintBtn) return paintCommand(win, paintBtn.dataset.paint);

                const mineBtn = event.target.closest("[data-mine]");
                if (mineBtn) return mineInit(win);

                const mineCell = event.target.closest("[data-mine-cell]");
                if (mineCell) return mineOpen(win, Number(mineCell.dataset.mineCell));

                const taskBtn = event.target.closest("[data-task]");
                if (taskBtn) {
                    if (taskBtn.dataset.task === "refresh") return taskmgrRender(win);
                    if (taskBtn.dataset.task === "end") return taskmgrEnd(win);
                    return;
                }

                const taskRow = event.target.closest("[data-task-app]");
                if (taskRow) {
                    $$("[data-task-app]", win).forEach(row => row.classList.remove("selected"));
                    taskRow.classList.add("selected");
                    win.dataset.selectedTask = taskRow.dataset.taskApp;
                    return;
                }

                const calBtn = event.target.closest("[data-cal]");
                if (calBtn) {
                    const delta = calBtn.dataset.cal === "next" ? 1 : -1;
                    win._calMonth = (win._calMonth ?? 0) + delta;
                    return calendarRender(win);
                }

                const mediaPlay = event.target.closest("[data-media-play]");
                if (mediaPlay) return mediaPlayTrack(win, Number(mediaPlay.dataset.mediaPlay));

                if (event.target.closest("[data-media-stop]")) {
                    if (win._mediaStop) win._mediaStop();
                    return;
                }

                const setting = event.target.closest("[data-setting]");
                if (setting) {
                    document.body.classList.toggle("dark");
                    localStorage.setItem("web-windows-dark", document.body.classList.contains("dark"));
                    return;
                }

                const wallpaper = event.target.closest("[data-wallpaper]");
                if (wallpaper) return setWallpaper(wallpaper.dataset.wallpaper);

                const trashAction = event.target.closest("[data-trash]");
                if (trashAction) {
                    if (trashAction.dataset.trash === "empty") emptyTrash();
                    if (trashAction.dataset.trash === "restore") restoreSelected(win);
                    return;
                }
            });

            win.addEventListener("input", event => {
                if (event.target.matches("[data-filter]")) renderExplorer(win);
                if (event.target.matches(".notepad-text")) {
                    const fileId = win.dataset.fileId;
                    const node = fileId && findNode(fileId);
                    if (node) {
                        node.content = event.target.value;
                        saveFS();
                    }
                }
            });

            win.addEventListener("contextmenu", event => {
                const mineCell = event.target.closest("[data-mine-cell]");
                if (mineCell) {
                    event.preventDefault();
                    return mineFlag(win, Number(mineCell.dataset.mineCell));
                }
                const item = event.target.closest("[data-file-id]");
                if (item) {
                    event.preventDefault();
                    showContextMenu(event.clientX, event.clientY, {
                        place: "explorer",
                        nodeId: item.dataset.fileId,
                        folderId: win.dataset.folderId || fs.id,
                        app: win.dataset.app
                    });
                }
            });

            if (win.dataset.app === "explorer") {
                win.dataset.folderId = fs.id;
                renderExplorer(win);
            }
            if (win.dataset.app === "trash") renderTrash(win);
            if (win.dataset.app === "browser") browserHome(win);
            if (win.dataset.app === "terminal") setTimeout(() => $(".term-input", win)?.focus(), 50);
            if (win.dataset.app === "paint") paintInit(win);
            if (win.dataset.app === "minesweeper") mineInit(win);
            if (win.dataset.app === "calendar") { win._calMonth = 0; calendarRender(win); }
            if (win.dataset.app === "taskmgr") {
                taskmgrRender(win);
                win._tmTimer = setInterval(() => {
                    if (win.isConnected && !win.classList.contains("minimized")) taskmgrRender(win, true);
                }, 2500);
            }

            const termInput = $(".term-input", win);
            if (termInput) {
                termInput.addEventListener("keydown", event => {
                    if (event.key === "Enter") terminalRun(win, termInput.value);
                });
            }
        }

        function toggleMaximize(win) {
            if (win.classList.toggle("maximized")) {
                win.style.transform = "none";
            } else {
                win.style.left = "50%";
                win.style.top = "80px";
                win.style.transform = "translateX(-50%)";
                win.style.width = "";
                win.style.height = "";
            }
        }

        function updateTaskbar() {
            $$("[data-launch]").forEach(button => {
                const win = windows.get(button.dataset.launch);
                button.classList.toggle("open", Boolean(win));
                button.classList.toggle("active", Boolean(win && !win.classList.contains("minimized")));
            });
        }

        function showFolder(win, folderId) {
            const node = findNode(folderId);
            if (!node || node.type !== "folder") return;
            win.dataset.folderId = folderId;
            renderExplorer(win);
        }

        function renderExplorer(win) {
            const folderId = win.dataset.folderId || fs.id;
            const current = findNode(folderId);
            if (!current || current.type !== "folder") {
                win.dataset.folderId = fs.id;
                return renderExplorer(win);
            }

            const address = $("[data-address]", win);
            const area = $("[data-files-area]", win);
            if (!area) return;
            address.textContent = "📂 " + current.name;

            const query = ($("[data-filter]", win)?.value || "").trim().toLowerCase();
            const items = current.children.filter(node => node.name.toLowerCase().includes(query));

            area.innerHTML = `
                <h2 class="files-heading">${escapeHTML(current.name)}</h2>
                ${items.length ? `<div class="file-grid">${items.map(node => `
                    <div class="file-item" data-file-id="${escapeHTML(node.id)}" title="${escapeHTML(node.name)}">
                        <span class="icon">${iconFor(node)}</span>${escapeHTML(node.name)}
                    </div>`).join("")}</div>` : `<p class="empty">此文件夹为空。可以点击上方按钮新建文件。</p>`}`;
        }

        function renderTrash(win) {
            const area = $("[data-trash-area]", win);
            if (!area) return;
            area.innerHTML = trash.length
                ? `<div class="file-grid">${trash.map(entry => `
                    <div class="file-item" data-trash-id="${escapeHTML(entry.node.id)}">
                        <span class="icon">${iconFor(entry.node)}</span>${escapeHTML(entry.node.name)}
                    </div>`).join("")}</div>`
                : `<p class="empty">回收站为空。</p>`;

            $$("[data-trash-id]", win).forEach(item => {
                item.addEventListener("click", () => {
                    $$("[data-trash-id]", win).forEach(other => other.classList.remove("selected"));
                    item.classList.add("selected");
                    win.dataset.selectedTrash = item.dataset.trashId;
                });
                item.addEventListener("dblclick", () => restoreItem(item.dataset.trashId));
            });
        }

        function createItem(parentId, type) {
            const parent = findNode(parentId);
            if (!parent || parent.type !== "folder") return;

            const defaultName = type === "folder" ? "新建文件夹" : "新建文本文档.txt";
            const name = prompt(type === "folder" ? "输入文件夹名称：" : "输入文件名称：", defaultName);
            if (name === null) return;

            const cleanName = name.trim();
            if (!cleanName) return notify("名称不能为空");
            if (parent.children.some(item => item.name.toLowerCase() === cleanName.toLowerCase())) {
                return notify("该位置已经存在同名文件或文件夹");
            }

            const node = type === "folder" ? folder(cleanName) : file(cleanName);
            parent.children.push(node);
            saveFS();
            refreshAll();
            notify(type === "folder" ? "文件夹已创建" : "文件已创建");
        }

        function renameItem(nodeId) {
            const node = findNode(nodeId);
            const parent = findParent(nodeId);
            if (!node || !parent) return;
            const name = prompt("输入新名称：", node.name);
            if (name === null) return;
            const cleanName = name.trim();
            if (!cleanName) return notify("名称不能为空");
            if (parent.children.some(item => item.id !== nodeId && item.name.toLowerCase() === cleanName.toLowerCase())) {
                return notify("该位置已经存在同名文件或文件夹");
            }
            node.name = cleanName;
            saveFS();
            refreshAll();
            notify("已重命名");
        }

        function deleteItem(nodeId) {
            const parent = findParent(nodeId);
            if (!parent) return;
            const index = parent.children.findIndex(item => item.id === nodeId);
            if (index < 0) return;
            const [node] = parent.children.splice(index, 1);
            trash.push({ node, parentId: parent.id, deletedAt: Date.now() });
            saveFS();
            refreshAll();
            notify("项目已移到回收站");
        }

        function restoreItem(nodeId) {
            const index = trash.findIndex(entry => entry.node.id === nodeId);
            if (index < 0) return;
            const entry = trash[index];
            let parent = findNode(entry.parentId);
            if (!parent || parent.type !== "folder") parent = desktopFolder();

            if (parent.children.some(item => item.name.toLowerCase() === entry.node.name.toLowerCase())) {
                entry.node.name = "恢复的 " + entry.node.name;
            }
            parent.children.push(entry.node);
            trash.splice(index, 1);
            saveFS();
            refreshAll();
            notify("已还原");
        }

        function restoreSelected(win) {
            const selected = win.dataset.selectedTrash;
            if (!selected) return notify("请选择要还原的删除项");
            restoreItem(selected);
        }

        function emptyTrash() {
            if (!trash.length) return notify("回收站已经是空的");
            if (!confirm("确定要永久删除回收站中的所有项目吗？")) return;
            trash = [];
            saveFS();
            refreshAll();
            notify("回收站已清空");
        }

        function refreshAll() {
            renderDesktop();
            for (const win of windows.values()) {
                if (win.dataset.app === "explorer") renderExplorer(win);
                if (win.dataset.app === "trash") renderTrash(win);
            }
        }

        function openNode(nodeId) {
            const node = findNode(nodeId);
            if (!node) return;
            if (node.type === "folder") {
                openApp("explorer", { folderId: node.id });
            } else if (/\.(png|jpe?g|gif|webp|bmp)$/i.test(node.name)) {
                openApp("photos", { fileId: node.id });
            } else {
                openApp("notepad", { fileId: node.id });
            }
        }

        function copyOrCut(nodeId, mode) {
            const node = findNode(nodeId);
            if (!node) return;
            clipboard = { nodeId, mode };
            notify(mode === "copy" ? "已复制" : "已剪切");
        }

        function pasteInto(parentId) {
            if (!clipboard) return notify("剪贴板为空");
            const source = findNode(clipboard.nodeId);
            const target = findNode(parentId);
            if (!source || !target || target.type !== "folder") return notify("无法粘贴");

            if (source.id === target.id || (source.type === "folder" && containsNode(source, target.id))) {
                return notify("不能将文件夹粘贴到自身内部");
            }

            if (target.children.some(item => item.name.toLowerCase() === source.name.toLowerCase())) {
                return notify("目标位置已有同名项目");
            }

            if (clipboard.mode === "cut") {
                const parent = findParent(source.id);
                if (!parent) return;
                parent.children = parent.children.filter(item => item.id !== source.id);
                target.children.push(source);
                clipboard = null;
            } else {
                target.children.push(cloneNode(source));
            }

            saveFS();
            refreshAll();
            notify("已粘贴");
        }

        function containsNode(root, targetId) {
            if (root.id === targetId) return true;
            return root.type === "folder" && root.children.some(child => containsNode(child, targetId));
        }

        function cloneNode(node) {
            const copy = { ...node, id: id() };
            if (node.type === "folder") copy.children = node.children.map(cloneNode);
            return copy;
        }

        function runExplorerCommand(win, command) {
            const folderId = win.dataset.folderId || fs.id;
            if (command === "new-folder") return createItem(folderId, "folder");
            if (command === "new-file") return createItem(folderId, "file");
            if (command === "refresh") {
                renderExplorer(win);
                return notify("已刷新");
            }
            if (command === "up") {
                const parent = findParent(folderId);
                if (parent) showFolder(win, parent.id);
                return;
            }
            if (command === "back" || command === "forward") {
                return notify("浏览器前进后退尚未实现");
            }
        }

        function goLocation(win, location) {
            if (location === "trash") return openApp("trash");
            if (location === "root") return showFolder(win, fs.id);
            const nameMap = {
                desktop: "桌面", documents: "文档", downloads: "下载", pictures: "图片"
            };
            const target = fs.children.find(item => item.name === nameMap[location]);
            if (target) showFolder(win, target.id);
        }

        function noteCommand(win, command) {
            const textarea = $(".notepad-text", win);
            if (command === "new") {
                win.dataset.fileId = "";
                textarea.value = "";
                $("[data-note-name]", win).textContent = "未命名.txt";
                textarea.focus();
                return;
            }

            if (command === "save") {
                const fileId = win.dataset.fileId;
                let node = fileId && findNode(fileId);
                if (!node) {
                    const name = prompt("保存为文件名：", "新建文本文档.txt");
                    if (name === null || !name.trim()) return;
                    const parent = desktopFolder();
                    node = file(name.trim(), textarea.value);
                    parent.children.push(node);
                    win.dataset.fileId = node.id;
                    $("[data-note-name]", win).textContent = node.name;
                } else {
                    node.content = textarea.value;
                }
                saveFS();
                refreshAll();
                notify("文件已保存");
            }
        }

        function loadTextFile(win, fileId) {
            const node = findNode(fileId);
            if (!node || node.type !== "file") return;
            win.dataset.fileId = node.id;
            $(".notepad-text", win).value = node.content || "";
            $("[data-note-name]", win).textContent = node.name;
        }

        function loadPhoto(win, fileId) {
            const node = findNode(fileId);
            if (!node) return;
            const img = $("[data-photo-img]", win);
            if (img) img.src = node.content || "";
            $(".window-title span:last-child", win).textContent = node.name;
        }

        function calculatorKey(win, key) {
            const display = $(".calc-display", win);
            let value = display.value;
            const map = { "÷": "/", "×": "*", "−": "-" };

            if (key === "C") return display.value = "0";
            if (key === "⌫") return display.value = value.length > 1 ? value.slice(0, -1) : "0";
            if (key === "±") return display.value = String(Number(value) * -1);

            if (key === "=") {
                try {
                    let expression = value.replace(/[÷×−]/g, ch => map[ch]);
                    if (!/^[0-9+*/().% -]+$/.test(expression)) throw new Error();
                    const result = Function('"use strict";return (' + expression + ')')();
                    display.value = Number.isFinite(result) ? String(Number(result.toFixed(10))) : "错误";
                } catch {
                    display.value = "错误";
                }
                return;
            }

            const mapped = map[key] || key;
            display.value = value === "0" || value === "错误"
                ? (/^[0-9.]$/.test(mapped) ? mapped : value + mapped)
                : value + mapped;
        }

        /* ================= 浏览器 ================= */

        function normalizeUrl(raw) {
            const value = String(raw || "").trim();
            if (!value) return "";
            if (/^(https?:\/\/|about:)/i.test(value)) return value;
            if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(value)) return "https://" + value;
            return "https://www.bing.com/search?q=" + encodeURIComponent(value);
        }

        function browserHome(win) {
            const frame = $("[data-frame]", win);
            if (!frame) return;
            win._bHist = ["about:home"];
            win._bIdx = 0;
            frame.removeAttribute("src");
            frame.srcdoc = getBrowserHome();
            const url = $("[data-url]", win);
            if (url) url.value = "主页";
        }

        function browserLoad(win, url) {
            const frame = $("[data-frame]", win);
            if (!frame) return;
            if (url === "about:home") {
                browserHome(win);
                return;
            }
            frame.removeAttribute("srcdoc");
            frame.src = url;
            const urlInput = $("[data-url]", win);
            if (urlInput) urlInput.value = url;
        }

        function browserNavigate(win, raw) {
            const url = normalizeUrl(raw);
            if (!url) return notify("请输入网址");
            win._bHist = (win._bHist || ["about:home"]).slice(0, win._bIdx + 1);
            win._bHist.push(url);
            win._bIdx = win._bHist.length - 1;
            browserLoad(win, url);
        }

        function browserCommand(win, command) {
            const urlInput = $("[data-url]", win);
            if (!win._bHist) browserHome(win);

            if (command === "go") return browserNavigate(win, urlInput.value);
            if (command === "home") {
                win._bHist.push("about:home");
                win._bIdx = win._bHist.length - 1;
                return browserHome(win);
            }
            if (command === "reload") {
                const current = win._bHist[win._bIdx] || "about:home";
                return browserLoad(win, current);
            }
            if (command === "back") {
                if (win._bIdx > 0) {
                    win._bIdx--;
                    browserLoad(win, win._bHist[win._bIdx]);
                }
                return;
            }
            if (command === "forward") {
                if (win._bIdx < win._bHist.length - 1) {
                    win._bIdx++;
                    browserLoad(win, win._bHist[win._bIdx]);
                }
                return;
            }
            if (command === "newtab") {
                const current = win._bHist[win._bIdx];
                if (current && current !== "about:home") {
                    window.open(current, "_blank", "noopener");
                    return notify("已在系统浏览器中打开");
                }
                return notify("当前是主页，请先打开一个网页");
            }
        }

        /* ================= 画图 ================= */

        function paintInit(win) {
            const canvas = $("[data-paint-canvas]", win);
            if (!canvas || canvas._ready) return;
            canvas._ready = true;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            let drawing = false;
            let lastX = 0;
            let lastY = 0;

            const pos = event => {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (event.clientX - rect.left) * (canvas.width / rect.width),
                    y: (event.clientY - rect.top) * (canvas.height / rect.height)
                };
            };

            canvas.addEventListener("pointerdown", event => {
                drawing = true;
                ({ x: lastX, y: lastY } = pos(event));
                canvas.setPointerCapture(event.pointerId);
            });
            canvas.addEventListener("pointermove", event => {
                if (!drawing) return;
                const { x, y } = pos(event);
                const color = $("[data-paint-color]", win).value;
                const size = Number($("[data-paint-size]", win).value);
                const eraser = $("[data-paint-eraser]", win).checked;
                ctx.strokeStyle = eraser ? "#fff" : color;
                ctx.lineWidth = eraser ? size * 3 : size;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
                lastX = x;
                lastY = y;
            });
            canvas.addEventListener("pointerup", () => drawing = false);
            canvas.addEventListener("pointercancel", () => drawing = false);
        }

        function paintCommand(win, command) {
            const canvas = $("[data-paint-canvas]", win);
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            if (command === "clear") {
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return notify("画布已清空");
            }

            if (command === "save") {
                const name = prompt("保存图片名称：", "我的画作.png");
                if (name === null || !name.trim()) return;
                const fileName = /\.png$/i.test(name.trim()) ? name.trim() : name.trim() + ".png";
                const parent = desktopFolder();
                if (parent.children.some(item => item.name.toLowerCase() === fileName.toLowerCase())) {
                    return notify("桌面已有同名文件");
                }
                parent.children.push(file(fileName, canvas.toDataURL("image/png")));
                saveFS();
                refreshAll();
                notify("画作已保存到桌面，双击可查看");
            }
        }

        /* ================= 终端 ================= */

        function terminalPrint(win, text) {
            const out = $("[data-term-out]", win);
            if (out) {
                out.textContent += text + "\n";
                out.scrollTop = out.scrollHeight;
            }
        }

        function terminalRun(win, raw) {
            const input = $(".term-input", win);
            const line = raw.trim();
            terminalPrint(win, "C:\\Users\\用户> " + line);
            input.value = "";
            if (!line) return;

            const [cmd, ...args] = line.split(/\s+/);
            const arg = args.join(" ");

            switch (cmd.toLowerCase()) {
                case "help":
                    terminalPrint(win, [
                        "可用命令：",
                        "  help          显示本帮助",
                        "  ver           显示系统版本",
                        "  date / time   显示日期 / 时间",
                        "  dir           列出此电脑根目录内容",
                        "  echo <文本>   输出文本",
                        "  open <应用>   打开应用（explorer/browser/notepad/calculator/paint/",
                        "                minesweeper/calendar/media/taskmgr/settings/trash/about）",
                        "  tree          显示目录树",
                        "  whoami        显示当前用户",
                        "  cls           清屏",
                        "  shutdown      关机（开玩笑）"
                    ].join("\n"));
                    break;
                case "ver":
                    terminalPrint(win, "Windows Web [版本 3.1.2607]");
                    break;
                case "date":
                    terminalPrint(win, new Date().toLocaleDateString("zh-CN"));
                    break;
                case "time":
                    terminalPrint(win, new Date().toLocaleTimeString("zh-CN"));
                    break;
                case "whoami":
                    terminalPrint(win, "windows-web\\用户");
                    break;
                case "echo":
                    terminalPrint(win, arg || "");
                    break;
                case "dir": {
                    const target = arg && fs.children.find(item =>
                        item.name.toLowerCase().includes(arg.toLowerCase())) || fs;
                    if (target.type !== "folder") return terminalPrint(win, "不是有效的目录。");
                    const lines = target.children.map(item =>
                        (item.type === "folder" ? "<DIR>   " : "        ") + item.name);
                    terminalPrint(win, (lines.length ? lines.join("\n") : "（空目录）") + "\n共 " + lines.length + " 项");
                    break;
                }
                case "tree": {
                    const lines = [];
                    (function walk(node, prefix) {
                        node.children.forEach((child, i) => {
                            const last = i === node.children.length - 1;
                            lines.push(prefix + (last ? "└─ " : "├─ ") + child.name);
                            if (child.type === "folder") walk(child, prefix + (last ? "   " : "│  "));
                        });
                    })(fs, "");
                    terminalPrint(win, lines.join("\n") || "（空）");
                    break;
                }
                case "open":
                    if (apps[arg]) {
                        openApp(arg);
                        terminalPrint(win, "正在打开 " + apps[arg].title + " …");
                    } else {
                        terminalPrint(win, "未知应用：" + (arg || "(空)") + "，输入 help 查看列表。");
                    }
                    break;
                case "cls":
                    $("[data-term-out]", win).textContent = "";
                    break;
                case "shutdown":
                    terminalPrint(win, "😄 这是模拟器，不能真的关机。");
                    break;
                default:
                    terminalPrint(win, "'" + cmd + "' 不是内部或外部命令，也不是可运行的程序。输入 help 查看命令。");
            }
        }

        /* ================= 扫雷 ================= */

        function mineInit(win) {
            const rows = 9, cols = 9, total = 10;
